name: Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish, e.g. v3.2.0rc37'
        required: true
        type: string
      skip_nightly:
        description: 'Manual maintainer waiver: skip the green-nightly gate and publish on UNPROVEN tests. workflow_dispatch only; ignored on tag-push.'
        required: false
        default: false
        type: boolean

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # nightly-gate: FR-008 -- a release must not publish on unproven tests. This
  # precondition job requires a green ci-nightly.yml run for the EXACT commit the
  # release tag points at BEFORE build-release runs (publish-pypi is blocked
  # transitively via build-release's needs edge). It resolves the tag -> SHA,
  # checks for an existing green nightly for that SHA, and with --dispatch kicks a
  # fresh one BY THE TAG REF (workflow_dispatch cannot target a bare 40-hex SHA;
  # the tag points at the release SHA so the run's head_sha matches), waiting to
  # a terminal conclusion. It FAILS CLOSED: a missing token / red / missing /
  # timed-out nightly all block publication (the OPPOSITE of the nightly
  # escalation degrade). See scripts/ci/release_nightly_gate.py.
  #
  # `actions: write` is required to issue the workflow_dispatch. The dispatch
  # uses a DEDICATED token (secret RELEASE_NIGHTLY_DISPATCH_TOKEN, a PAT or
  # GitHub App token): a workflow_dispatch issued with the default GITHUB_TOKEN
  # does NOT start a new run (documented recursion guard), so the gate would hang
  # then fail. Operator prerequisite: create that secret.
  #
  # MAINTAINER WAIVER: a manually-dispatched run with skip_nightly=true skips this
  # job entirely (so the RELEASE_NIGHTLY_DISPATCH_TOKEN secret is not even needed)
  # and publishes on UNPROVEN tests at the operator's explicit direction. The
  # waiver is workflow_dispatch-only -- a tag-push can NEVER bypass the gate. When
  # this job is waiver-skipped, build-release still runs; when it FAILS, it does
  # not (see build-release's if-guard). The waiver is announced loudly in the
  # build log and the run summary.
  nightly-gate:
    name: Release nightly gate (green nightly for the release SHA)
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_nightly) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Require a green nightly for the exact release SHA (fail-closed)
        env:
          # A dedicated PAT / GitHub App token -- the default GITHUB_TOKEN cannot
          # trigger a nested workflow run. Absent secret => fail-closed (no publish).
          GH_TOKEN: ${{ secrets.RELEASE_NIGHTLY_DISPATCH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/ci/release_nightly_gate.py --tag "${RELEASE_TAG}" --dispatch

  # ---------------------------------------------------------------------------
  # build-producer: builds the native event producer (services/event-producer) for
  # the three pinned platform legs by calling the reusable workflow
  # event-producer.yml in `release` mode (no warm start-time gate) on the release
  # ref, and uploads `producer-<leg>` (binary + producer-manifest.json) and
  # `producer-sbom`. build-release consumes them. `env` is not available in a
  # job-level `with:`, so the RELEASE_REF expression is repeated verbatim here;
  # tests/release/test_release_producer_stages.py pins the two texts equal.
  # Same nightly-gate waiver condition as build-release: a FAILED gate blocks the
  # native build too.
  # ---------------------------------------------------------------------------
  build-producer:
    name: Build the native event producer (release ref)
    needs: [nightly-gate]
    if: >-
      ${{
        !cancelled()
        && (
          needs.nightly-gate.result == 'success'
          || (
            needs.nightly-gate.result == 'skipped'
            && github.event_name == 'workflow_dispatch'
            && inputs.skip_nightly
          )
        )
      }}
    permissions:
      contents: read
    uses: ./.github/workflows/event-producer.yml
    with:
      mode: release
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

  build-release:
    needs: [nightly-gate, build-producer]
    # Run when the nightly gate PASSED, or when it was deliberately SKIPPED by the
    # workflow_dispatch maintainer waiver (skip_nightly=true), AND the native
    # producer build succeeded. A FAILED or CANCELLED gate (or producer build) still
    # blocks the build -- and therefore publication. `!cancelled()` (not
    # `always()`) re-enables this job after a skipped dependency without letting it
    # run on cancellation.
    if: >-
      ${{
        !cancelled()
        && needs.build-producer.result == 'success'
        && (
          needs.nightly-gate.result == 'success'
          || (
            needs.nightly-gate.result == 'skipped'
            && github.event_name == 'workflow_dispatch'
            && inputs.skip_nightly
          )
        )
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Announce nightly-gate waiver (maintainer override)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_nightly }}
        run: |
          echo "::warning title=Nightly gate waived::Publishing ${RELEASE_TAG} WITHOUT a green ci-nightly for the release SHA (manual maintainer waiver skip_nightly=true)."
          {
            echo "### ⚠️ Nightly gate waived"
            echo ""
            echo "This release of \`${RELEASE_TAG}\` was published with the **skip_nightly** maintainer waiver:"
            echo "the green-nightly-for-the-release-SHA gate (#5034 / FR-008) was bypassed."
            echo "Publication proceeded on UNPROVEN tests at the operator's explicit direction."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install tooling
        run: |
          uv sync --frozen --python "$(which python)" --extra test --extra lint
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/pip install twine==6.2.0 tomli==2.4.1

      - name: Verify test isolation
        run: |
          cat > verify_isolation.py << 'EOF'
          import sys
          import tomllib

          # Get source version from pyproject.toml
          with open("pyproject.toml", "rb") as f:
              source_version = tomllib.load(f)["project"]["version"]

          # Try to get installed version
          try:
              from importlib.metadata import version
              installed_version = version("spec-kitty-cli")
          except Exception:
              print(f"✅ No installed version detected (source: {source_version})")
              sys.exit(0)

          # Check if versions match
          if installed_version == source_version:
              print(f"✅ Version match: {source_version}")
              sys.exit(0)
          else:
              print(f"❌ Version mismatch! Source: {source_version}, Installed: {installed_version}")
              print("This will cause test failures. Aborting release.")
              sys.exit(1)
          EOF
          python verify_isolation.py

      - name: Run tests
        run: |
          # Main CI owns the broad module matrix. The tag-time release workflow
          # exercises release-specific behavior, then gates publication on
          # metadata validation, build integrity, exact wheel installability,
          # and shared-package drift checks.
          python -m pytest -v --import-mode=importlib tests/release 2>&1 | tee pytest-output.txt
          exit "${PIPESTATUS[0]}"

      - name: Validate release metadata
        run: python scripts/release/validate_release.py --mode tag --tag "${RELEASE_TAG}" --tag-pattern "v*.*.*"

      - name: Classify release channel
        id: release_channel
        run: |
          VERSION="${RELEASE_TAG#v}"
          VERSION="${VERSION,,}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(a|b|rc|alpha|beta)[0-9]*$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Build distributions
        run: python -m build

      # The three producer legs built by build-producer. The pattern excludes `producer-sbom`
      # (check_dist_set.py refuses an unpinned `producer-*` directory); the SBOM is consumed by publish-pypi.
      - name: Download the producer legs (build-producer artifacts)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: producer-*-*
          path: producer-in

      # Platform wheels are built from THIS checkout, not from the sdist: the sdist include list is not widened, so the
      # hook file and the ignored `_native/` directory are not in it. One wheel per `platform_wheels` entry of dist-set.json,
      # each with a clean build directory; the hook is off by default and acts only under HATCH_BUILD_HOOK_ENABLE_CUSTOM=true.
      - name: Build the platform wheels (one per dist-set.json entry)
        run: |
          set -euo pipefail
          [ "$(jq '.platform_wheels | length' scripts/release/dist-set.json)" -ge 1 ] || { echo "::error::dist-set.json pins no platform wheel"; exit 1; }
          while read -r leg tag; do
            binary=$(find "producer-in/producer-${leg}" -maxdepth 1 -type f \( -name 'spec-kitty-event-producer' -o -name 'spec-kitty-event-producer.exe' \) | head -n 1)
            [ -n "$binary" ] || { echo "::error::no producer binary for ${leg} under producer-in"; exit 1; }
            rm -rf build
            HATCH_BUILD_HOOK_ENABLE_CUSTOM=true SPEC_KITTY_PRODUCER_BINARY="$PWD/$binary" SPEC_KITTY_PRODUCER_PLATFORM_TAG="$tag" python -m build --wheel --outdir dist
          done < <(jq -r '.platform_wheels[] | "\(.leg) \(.tag)"' scripts/release/dist-set.json)
          ls -l dist

      # Checksum continuity (AC-032): every manifest names this checkout's commit and the pinned tag, and the recomputed sha256 of the
      # downloaded binary equals the manifest and the wheel member. Needs the built wheels, so it follows the platform-wheel build.
      - name: Verify checksum continuity from the producer manifests to the wheels
        run: python scripts/release/check_dist_set.py --verify-manifests --manifests producer-in --commit "$(git rev-parse HEAD)"

      - name: Verify the platform-wheel binaries (set, sha256, exec bit)
        run: python scripts/release/check_dist_set.py --verify-binaries

      - name: Validate shared package drift
        run: python scripts/release/check_shared_package_drift.py --check-installed

      # pip installs only wheels whose tag fits the host, so this Linux runner installs the Linux platform wheel and the pure wheel;
      # the macOS and Windows wheels are installed by path on their own OS in smoke-wheels.
      - name: Verify exact installability from built wheels (Linux platform wheel and pure wheel)
        run: |
          set -euo pipefail
          for tag in $(jq -r '[(.platform_wheels[] | select(.leg | startswith("linux")) | .tag)] + .pure_wheels | .[]' scripts/release/dist-set.json); do
            python scripts/release/check_exact_install.py --package spec-kitty-cli --wheel-tag "$tag" --console-script spec-kitty --console-arg=--version
          done

      - name: Verify wheel contents
        run: |
          set -euo pipefail
          # Every wheel of the set (pure and platform) carries the same payload: the checks run once per wheel, each with a clean extraction directory.
          for WHEEL_FILE in dist/*.whl; do
          echo "Wheel: $WHEEL_FILE"
          echo "::group::Verifying migration files in wheel"

          # Count tracked migration files in source. The test suite may generate
          # temporary files in the workspace, so verify against the repository
          # contents rather than the mutated working tree.
          SOURCE_COUNT=$(git ls-files src/specify_cli/upgrade/migrations | grep -c '/m_.*\.py$' | tr -d ' ')
          echo "Source migrations count: $SOURCE_COUNT"

          # Extract wheel to temp directory
          rm -rf /tmp/wheel_check
          unzip -q "$WHEEL_FILE" -d /tmp/wheel_check

          # Count migration files in wheel
          WHEEL_COUNT=$(find /tmp/wheel_check/specify_cli/upgrade/migrations -name "m_*.py" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "Wheel migrations count: $WHEEL_COUNT"

          # List migrations in both
          echo "Source migrations:"
          find src/specify_cli/upgrade/migrations -name "m_*.py" -type f | sort | xargs -n1 basename

          echo "Wheel migrations:"
          find /tmp/wheel_check/specify_cli/upgrade/migrations -name "m_*.py" -type f 2>/dev/null | sort | xargs -n1 basename

          # Verify counts match
          if [ "$SOURCE_COUNT" -ne "$WHEEL_COUNT" ]; then
            echo "::error::Migration file count mismatch! Source: $SOURCE_COUNT, Wheel: $WHEEL_COUNT"
            echo "::error::This means some migration files are missing from the wheel package."
            echo "::error::Check pyproject.toml [tool.hatch.build.targets.wheel] configuration."
            exit 1
          fi

          echo "✅ Wheel contains all $SOURCE_COUNT migration files"
          echo "::endgroup::"

          echo "::group::Verifying doctrine payload in wheel"

          # Count tracked doctrine files in source. Release tests can mutate the
          # checkout, so use the tracked tree as the source of truth here too.
          #
          # Path re-homed (charter-code-topology-01M152G1, S5): the former
          # built-in package relocated to src/charter/offering (S2a), so this
          # payload check now counts that tree / the wheel's charter/offering/
          # extraction path. The prior src/doctrine/hatch_build.py +
          # src/doctrine/pyproject.toml exclusions are gone too -- the dormant,
          # never-built spec-kitty-doctrine wheel groundwork they described
          # (src/charter/offering/hatch_build.py + .../pyproject.toml) was DELETED
          # outright per MAP-BUILD, not merely excluded, so there is nothing left
          # under src/charter/offering to exclude from this count.
          SOURCE_DOCTRINE_COUNT=$(git ls-files src/charter/offering | wc -l | tr -d ' ')
          echo "Source doctrine file count: $SOURCE_DOCTRINE_COUNT"

          WHEEL_DOCTRINE_COUNT=$(find /tmp/wheel_check/charter/offering -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "Wheel doctrine file count: $WHEEL_DOCTRINE_COUNT"

          SOURCE_SKILL_COUNT=$(git ls-files src/charter/offering/skills | grep -c '/SKILL\.md$' | tr -d ' ')
          echo "Source bundled skill count: $SOURCE_SKILL_COUNT"

          WHEEL_SKILL_COUNT=$(find /tmp/wheel_check/charter/offering/skills -path '*/SKILL.md' -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "Wheel bundled skill count: $WHEEL_SKILL_COUNT"

          if [ "$SOURCE_DOCTRINE_COUNT" -ne "$WHEEL_DOCTRINE_COUNT" ]; then
            echo "::error::Doctrine file count mismatch! Source: $SOURCE_DOCTRINE_COUNT, Wheel: $WHEEL_DOCTRINE_COUNT"
            echo "::error::This means doctrine resources are missing from the wheel package."
            echo "::error::Check pyproject.toml [tool.hatch.build.targets.wheel] configuration."
            exit 1
          fi

          if [ "$SOURCE_SKILL_COUNT" -ne "$WHEEL_SKILL_COUNT" ]; then
            echo "::error::Bundled skill count mismatch! Source: $SOURCE_SKILL_COUNT, Wheel: $WHEEL_SKILL_COUNT"
            echo "::error::The wheel must ship every canonical SKILL.md under charter/offering/skills."
            exit 1
          fi

          echo "✅ Wheel contains all $SOURCE_DOCTRINE_COUNT doctrine files and $SOURCE_SKILL_COUNT bundled skills"
          echo "::endgroup::"
          done

      - name: Generate CycloneDX SBOM
        # Snapshot the resolved environment at build time so every release ships
        # a machine-readable dependency inventory. Enterprise evaluators can ingest
        # this into Dependency-Track or similar tooling for continuous CVE monitoring
        # without rescanning the package themselves.
        run: |
          cyclonedx-py environment \
            --of JSON \
            -o sbom.cdx.json \
            --pyproject pyproject.toml
          echo "SBOM component count: $(python -c "import json; d=json.load(open('sbom.cdx.json')); print(len(d.get('components', [])))")"

      - name: Check distributions
        run: twine check dist/*

      - name: Verify the lock file is current
        run: uv lock --check

      - name: Record artifact checksums
        run: |
          sha256sum dist/* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload test output
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-output
          path: pytest-output.txt
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-distributions
          path: |
            dist/
            SHA256SUMS.txt
            sbom.cdx.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # smoke-wheels: installs each built wheel BY PATH into a fresh virtual environment on its own OS and runs the shared composite action
  # (the same definition event-producer.yml's native-smoke uses) in `cli` mode: a platform wheel must produce one valid row, the pure
  # wheel must report `binary-missing`. publish-pypi needs it. The `command` is `init` alone: it hands exactly ONE row (ProjectInitialized) to the
  # producer, which the shared action's check (one publish log holding one line) requires. `agent mission create` would add MissionCreated and
  # SpecifyStarted and a second log. Confirmed against a built wheel only up to the producer hand-off; the first release candidate runs the binary.
  # ---------------------------------------------------------------------------
  smoke-wheels:
    name: smoke-wheels (${{ matrix.leg }})
    needs: build-release
    # On the maintainer waiver path (workflow_dispatch skip_nightly=true) nightly-gate is skipped, and the default success() would
    # propagate that skip down the chain to this job and to publish-pypi. Override explicitly: run whenever build-release succeeded
    # and nothing was cancelled. A failed build-release still skips this job.
    if: ${{ !cancelled() && needs.build-release.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GIT_AUTHOR_NAME: smoke
      GIT_AUTHOR_EMAIL: smoke@example.invalid
      GIT_COMMITTER_NAME: smoke
      GIT_COMMITTER_EMAIL: smoke@example.invalid
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: linux-x86_64
            os: ubuntu-24.04
            expect: produced
          - leg: macos-arm64
            os: macos-14
            expect: produced
          - leg: windows-x86_64
            os: windows-2022
            expect: produced
          - leg: pure
            os: ubuntu-24.04
            expect: binary-missing
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'

      - name: Download build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-distributions
          path: release-in

      - name: Select the wheel of this leg
        env:
          LEG: ${{ matrix.leg }}
        run: |
          set -euo pipefail
          if [ "$LEG" = "pure" ]; then
            tag=$(jq -r '.pure_wheels[0]' scripts/release/dist-set.json)
          else
            tag=$(jq -r --arg leg "$LEG" '.platform_wheels[] | select(.leg == $leg) | .tag' scripts/release/dist-set.json)
          fi
          [ -n "$tag" ] && [ "$tag" != "null" ] || { echo "::error::no wheel tag pinned for ${LEG}"; exit 1; }
          wheel=$(find release-in/dist -maxdepth 1 -type f -name "*-${tag}.whl")
          [ "$(printf '%s\n' "$wheel" | grep -c .)" = "1" ] || { echo "::error::expected exactly one ${tag} wheel, found: ${wheel}"; exit 1; }
          if command -v cygpath >/dev/null 2>&1; then wheel=$(cygpath -m "$PWD/$wheel"); else wheel="$PWD/$wheel"; fi
          echo "SMOKE_WHEEL=$wheel" >> "$GITHUB_ENV"

      - name: Install the wheel by path and run the smoke
        uses: ./.github/actions/producer-smoke
        with:
          wheel: ${{ env.SMOKE_WHEEL }}
          mode: cli
          expect: ${{ matrix.expect }}
          command: >-
            git commit -q --allow-empty -m init
            && "$SMOKE_PY" -m specify_cli init . --ai claude --non-interactive

  publish-pypi:
    name: Publish to PyPI
    needs: [build-release, smoke-wheels]
    # A waiver-skipped nightly-gate (workflow_dispatch skip_nightly=true) propagates
    # its "skipped" state through the default success() condition, which would skip
    # this job -- and with it BOTH the GitHub release and the PyPI upload it owns --
    # even though build-release succeeded. Override explicitly: publish whenever
    # build-release succeeded and nothing was cancelled. On a normal tag-push the
    # gate runs and succeeds, so this is equivalent to the former implicit success().
    # publish-pypi is unreachable unless the build AND the per-OS wheel smoke succeeded.
    if: ${{ !cancelled() && needs.build-release.result == 'success' && needs.smoke-wheels.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment:
      name: pypi
      url: https://pypi.org/project/spec-kitty-cli/
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: .

      # The set, the binaries and the SBOM are checked again on the artifact that is about to be published, not only where it was built.
      - name: Re-check the distribution set and the wheel binaries on the downloaded artifact
        run: python scripts/release/check_dist_set.py --verify-binaries

      - name: Download the producer SBOM and the Linux leg manifest
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: producer-*
          path: producer-in

      - name: Check the producer SBOM (names a pinned dependency; the manifest lists the embedded toolchain)
        run: bash services/event-producer/tools/check-sbom.sh producer-in/producer-sbom/producer-sbom.json producer-in/producer-linux-x86_64/producer-manifest.json

      # Build provenance for every distribution. No reproducibility claim is made.
      - name: Attest build provenance of the distributions
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/*

      - name: Extract changelog for release
        id: changelog
        run: |
          VERSION="${RELEASE_TAG#v}"
          python scripts/release/extract_changelog.py "${VERSION}" > release-notes.md
          cat release-notes.md

      - name: Classify release channel
        id: release_channel
        run: |
          VERSION="${RELEASE_TAG#v}"
          VERSION="${VERSION,,}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(a|b|rc|alpha|beta)[0-9]*$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            SHA256SUMS.txt
            sbom.cdx.json
            producer-in/producer-sbom/producer-sbom.json
          draft: false
          prerelease: ${{ steps.release_channel.outputs.is_prerelease }}

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1 branch tip; OIDC trusted publishing)
        with:
          packages-dir: dist/

  verify-pypi-installability:
    name: Verify PyPI exact install
    needs: publish-pypi
    if: ${{ always() && needs.publish-pypi.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify exact install from PyPI
        run: |
          VERSION="${RELEASE_TAG#v}"
