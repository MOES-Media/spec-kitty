# Event Producer Nightly: scheduled build, smoke and start-time numbers of the native event producer (mission
# event-producer-reroute, WP09; AC-036).
#
# It calls the reusable workflow event-producer.yml (mode `pr`, which holds the warm start-time gate) on all three OS and runs the
# shared producer-smoke action on each leg; the per-leg job summaries record the AC-036 numbers (start time, binary size, floors).
#
# Why this is its own workflow and NOT a job of ci-nightly.yml: scripts/ci/release_nightly_gate.py decides from the whole
# conclusion of the ci-nightly.yml run for the release SHA, not from the nightly-summary job. Any failed job in that run, whether or
# not it is listed in nightly-summary.needs, turns the run red and blocks the release through the fail-closed nightly-gate. A macOS or
# Windows hosted-runner flake or a GraalVM download outage here must not be able to do that, so the producer nightly lives in a
# separate workflow file, like sonar.yml. It is informational: no job here is masked with continue-on-error (Standing Order 9), it
# simply is not an input of the release gate. The release itself relies on smoke-wheels in release.yml.
# tests/release/test_release_producer_stages.py pins that ci-nightly.yml holds no producer job.
#
# `schedule` + `workflow_dispatch` only: no pull_request or push trigger, so a PR event never starts it (a row of
# NON_CHANGE_TRIGGERED_WORKFLOWS). The called workflow runs at the caller's ref, so a manual dispatch of this file on a branch builds
# that branch; the scheduled run uses the default branch, as every schedule does.
# Concurrency: the group is this workflow's own. Under workflow_call, github.workflow inside event-producer.yml names THIS caller, so
# the called workflow's group cannot collide with the one of a PR run or of the release dispatch.
name: Event Producer Nightly

on:
  schedule:
    # 03:47 UTC: off the round hour and after ci-nightly.yml's own slot.
    - cron: '47 3 * * *'
  workflow_dispatch:

concurrency:
  group: event-producer-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  producer-nightly:
    # Canonical fork guard (tests/ci/test_fork_guard.py): automated runs are core-repo only; workflow_dispatch runs everywhere.
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: Event producer native build, smoke and start-time numbers (nightly, informational)
    permissions:
      contents: read
    uses: ./.github/workflows/event-producer.yml
    with:
      mode: pr
