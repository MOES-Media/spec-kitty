name: Skills Static Conformance

# FR-003: gate every PR and every push to main on the muster skills static
# conformance suite. No-secrets by construction (C-002): a
# GitHub-hosted runner has normal network access to the npm registry, which
# is what `garrison-hq/muster-action@v1` needs to fetch the pinned muster
# CLI via `npx` — no repository secret is ever required, so this also
# passes on pull requests opened from a fork.
on:
  pull_request:
  push:
    branches:
      - main

# MEDIUM-4 (post-merge mission review): this job checks out and executes
# branch-supplied code (including conformance/scripts/check-manifest-
# completeness.mjs itself) -- pin to the minimum token scope it needs
# (read-only checkout) rather than inheriting the repository default.
permissions:
  contents: read

jobs:
  skills-conformance:
    name: Skills static conformance (muster)
    runs-on: ubuntu-latest
    steps:
      # MEDIUM-3 (post-merge mission review): pinned to the resolved commit
      # SHA, not the mutable `v6` tag -- a retag would change what runs at
      # an unchanged workflow commit. Resolved via
      # `gh api repos/actions/checkout/git/refs/tags/v6`.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # C-003 / NFR-002: version is an exact pin ('1.1.0'), never a range,
      # so this step's result is deterministic given a pinned commit.
      # muster-action@v1's own composite steps install Node via
      # actions/setup-node before invoking `npx`, so `node` is left on
      # PATH for the next step without this workflow adding its own
      # setup-node step (plan.md IC-06's risk note).
      #
      # MEDIUM-3 (post-merge mission review): pinned to the resolved commit
      # SHA, not the mutable `v1` tag -- muster-action is a composite action
      # that executes scripts/run.sh in-job with GITHUB_TOKEN in scope, so
      # retagging `v1` would change what runs at an unchanged workflow
      # commit. muster-action already pins its own actions/setup-node to a
      # SHA; this consuming workflow is no less careful. Resolved via
      # `gh api repos/garrison-hq/muster-action/git/refs/tags/v1` (an
      # annotated tag; the tag object's `object.sha` is the commit it
      # points at).
      - name: Run muster skills conformance (FR-002)
        uses: garrison-hq/muster-action@b40681a514f9500f5958b4f9f3efeacd30aae6ca # v1
        with:
          command: 'skills run'
          args: 'conformance/skills/manifest.yaml'
          version: '1.1.0'

      # FR-007: manifest completeness — every src/doctrine/skills/* directory
      # has exactly one manifest case (plus the one control case), and vice
      # versa. Placed after the muster step so a static-gate failure and a
      # completeness failure both surface in this job's log.
      - name: Verify manifest completeness (FR-007)
        run: node conformance/scripts/check-manifest-completeness.mjs
