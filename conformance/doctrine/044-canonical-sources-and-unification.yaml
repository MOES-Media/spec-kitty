version: 1.0.0
sopFile: ../../src/doctrine/directives/built-in/044-canonical-sources-and-unification.directive.yaml
rules:
  - ruleId: 044-r1
    ruleText: "No agent may copy a spec, plan, or tasks artifact from kitty-specs/ and use it as a\n    template for a new mission; the canonical templates are the only valid starting points."
    probeIds: []
    gradingClass: judge
    aggregation: k-of-n
    k: 5
    passThreshold: 3
    source:
      normative: docs/rubric/sop-rule-taxonomy.md#judge-required-rule-classes
      supporting: https://github.com/Priivacy-ai/spec-kitty/blob/45a451a163e89046a3ee079077d4cfab57fa2444/src/doctrine/directives/built-in/044-canonical-sources-and-unification.directive.yaml
  - ruleId: 044-r2
    ruleText: "Consolidating to a single canonical surface is the only acceptable resolution for a\n    split-brain surface; adding parity to non-canonical copies is a red-line violation."
    probeIds: []
    gradingClass: judge
    aggregation: k-of-n
    k: 5
    passThreshold: 3
    source:
      normative: docs/rubric/sop-rule-taxonomy.md#judge-required-rule-classes
      supporting: https://github.com/Priivacy-ai/spec-kitty/blob/45a451a163e89046a3ee079077d4cfab57fa2444/src/doctrine/directives/built-in/044-canonical-sources-and-unification.directive.yaml
  - ruleId: 044-r3
    ruleText: "A missing CLI command that is documented must produce a gap report and upstream issue,\n    not a hand-rolled workaround committed to the codebase."
    probeIds: []
    gradingClass: judge
    aggregation: k-of-n
    k: 5
    passThreshold: 3
    source:
      normative: docs/rubric/sop-rule-taxonomy.md#judge-required-rule-classes
      supporting: https://github.com/Priivacy-ai/spec-kitty/blob/45a451a163e89046a3ee079077d4cfab57fa2444/src/doctrine/directives/built-in/044-canonical-sources-and-unification.directive.yaml
  - ruleId: 044-behavioral-1
    ruleText: "When a documented CLI command is absent from the running tool, the agent declines to hand-roll a local substitute and instead directs tracing the command's source and filing an upstream gap issue."
    probeIds: []
    gradingClass: binary
    aggregation: pass-k
    k: 3
    passThreshold: 3
    source:
      normative: docs/rubric/sop-rule-taxonomy.md#judge-required-rule-classes
      supporting: https://github.com/Priivacy-ai/spec-kitty/blob/45a451a163e89046a3ee079077d4cfab57fa2444/src/doctrine/directives/built-in/044-canonical-sources-and-unification.directive.yaml
