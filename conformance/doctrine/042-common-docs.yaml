    probeIds: []
    gradingClass: "binary"
    aggregation: "pass-k"
    k: 3
    passThreshold: 3
    source:
      normative: "docs/rubric/sop-rule-taxonomy.md#5-output-format"
      supporting: "https://github.com/Priivacy-ai/spec-kitty/blob/44cabfcabc619e0cb120587b483e917c277f54e5/src/doctrine/directives/built-in/042-common-docs.directive.yaml"
  - ruleId: "042-r4"
