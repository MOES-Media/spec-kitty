version: "1.0.0"
sopFile: "../../src/doctrine/directives/built-in/042-common-docs.directive.yaml"
rules:
  - ruleId: "042-r1"
    ruleText: "There is exactly one documentation root; a second root or a per-version"
    probeIds: []
    gradingClass: "binary"
    aggregation: "pass-k"
    k: 3
    passThreshold: 3
    source:
      normative: "docs/rubric/sop-rule-taxonomy.md#1-never-call-tool"
