- id: TASKS-DECOMP-011
  lens: One PR must still leave a readable diff
  severity: 3
  title: Single-PR readability rests on generated metadata exclusion and WP ordering that no artifact
    enforces
  evidence:
  - artifact: 'tasks-overview.md section 1: estimate 6 to 9 thousand Java lines, 2 to 3 thousand Python,
      1.5 thousand workflows/docs, ''reviewable by WP'' not as a raw diff'
  - artifact: wps.yaml WP01 owned services/event-producer/gradle/verification-metadata.xml
  claim: 'The overview honestly says the raw diff is not readable in a sitting and relies on ''eleven
    contiguous WP ranges'' and compact history. Nothing in any WP prompt requires that each WP''s commits
    stay contiguous and individually green on the PR, and the later ''compact history'' step can erase
    the WP boundaries. The reviewer cannot be told where WP ranges begin.

    '
  remediation: 'Add to the plan wrap-up step and README of this mission: the history compaction preserves
    one commit group per WP titled ''WPnn: ...'', and the PR body carries a table of WP, commit range,
    line count and reading order; mark verification-metadata.xml as linguist-generated in .gitattributes
    (WP01 owned file list would need .gitattributes). Re-evaluate the two-slice option in overview section
    1 once WP06 is split.

    '
- id: TASKS-DECOMP-012
  lens: WP single-concern and reviewable in one sitting
