  - artifact: 'tasks/WP09 T061: additive edit of build.gradle.kts and verification-metadata.xml (SBOM
      plugin), contradicting WP01 T003 ''later WPs add no dependencies'''
  claim: 'T061 adds a Gradle plugin, which is a dependency requiring new verification-metadata entries
    and dependency checksum review, contradicting WP01''s claim that the dependency set is settled in
