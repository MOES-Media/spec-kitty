- id: TASKS-DECOMP-009
  lens: Descriptions concrete enough to implement
  severity: 3
  title: WP10 end-to-end tests need a real native binary but give no skip or fail policy; red-first is
    impossible locally
  evidence:
  - artifact: tasks/WP10 T065, T067, T068 ('Per-OS legs run only in CI'); Gates
  - artifact: 'tasks/WP01 T006: hatchling absent from the checkout venv'
  claim: 'T065 requires a platform wheel built via the hook with the real GraalVM binary; the contributor
    machine has none, so the tests will either skip silently (vacuous green; the mission''s own reflexivity
    rule says a skipped gate is not a gate) or be unrunnable for the red-first commit rule the same prompt
    demands.

    '
  remediation: 'State: tests use the JVM-launched producer via a documented env hook for local runs, and
    a module-level guard that FAILS (not skips) when CI is set and no binary is present; record which
    assertions run only in the native CI leg. Add the floor ''at least one row appended'' to each test.

    '
