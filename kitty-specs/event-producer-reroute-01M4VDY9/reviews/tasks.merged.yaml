- id: TASKS-RELEASE-010
  lens: release workflow shape
  severity: 3
  title: Reusable-workflow job-level 'with:' repeats RELEASE_REF; 'confirm the env context behaviour'
    is left to implementation with no fallback
  evidence:
  - artifact: "tasks/WP09 \xA7 T059 ('repeat the RELEASE_REF expression in the job-level with:; confirm\
      \ the env context behaviour, plan 17')"
  - code: .github/workflows/release.yml:19-21 (RELEASE_TAG and RELEASE_REF are workflow-level env)
  - code: .github/workflows/release.yml:3-18 (ref is the tag name for both triggers; a called workflow's
      actions/checkout of 'ref' needs refs/tags/<tag> semantics only if a branch of the same name exists)
  claim: 'The env context is not available in jobs.<id>.with (only github, needs, strategy, matrix, inputs,
    vars), which is documented, so "confirm" cannot be done from a PR and the plan''s repeat-the-expression
    remedy is the only option; but the test "pins equal texts" is a text-equality check that does not
    execute. The called workflow also must validate that ref resolves to the SAME commit as the caller''s
    github.sha (workflow_dispatch of a tag input by an operator can check out a tag different from the
    run''s own sha, which breaks the "source commit == git rev-parse HEAD" continuity check if build-release
    checks out the tag while build-producer builds github.sha).

    '
  remediation: 'Resolve ref once in a first job (outputs.sha = git rev-parse of RELEASE_REF) and pass
    that SHA to producer-native.yml and to build-release''s checkout; make the continuity check compare
    manifests to that output instead of two independent resolutions. Replace "confirm the env context"
    by "use github/inputs expressions only", and extend the ownership test to assert the called workflow
    receives the same SHA output.

    '
