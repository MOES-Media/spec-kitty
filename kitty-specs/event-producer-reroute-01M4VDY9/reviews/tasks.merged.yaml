    '
  remediation: 'Add to WP06 owned_files tests/runtime/test_bridge_engine.py plus a census subtask step
    ''grep every class defining emit_significance_evaluated under tests/ and src/ (known: tests/next/test_mission_run_back_reference.py,
    tests/next/test_internal_runtime_coverage.py, tests/next/test_runtime_bridge_unit.py, tests/runtime/test_bridge_decision_log_flush.py)
    and add the method or prove the path is not reached''. Add launcher/src/test/java/.../retain/** to
    WP05 and event-producer.yml to the chokepoint table for WP03. In WP07 frontmatter note engine.py and
