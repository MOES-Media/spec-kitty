findings:
  - id: F-1
    severity: 3
    claim: "FR-027 says the gate 'fails on other new Python logic' beyond the thin client, seam wiring (FR-002..004) and FR-035 stamping. But the spec also requires other Python changes: lane-list consolidation (FR-034), init/upgrade gitignore entries (AC-023/FR-019), marker clearing (FR-032), doctor retention wiring and migrate/doctor message (FR-009, FR-030), packaging scripts and release gates (FR-041..044). An implementer cannot satisfy FR-027 literally, and 'new Python logic' is undefined and not mechanically testable."
    evidence: "spec.md FR-027, AC-012, G-11 versus FR-019, FR-032, FR-034, FR-009"
    remediation: "Plan phase: define the gate's allowed surface as an explicit path/symbol list (client module, seam wiring, FR-035 stamping, plus named non-logic edits: lane-list consolidation, init/upgrade ignore entries, marker comments, doctor pass-through, packaging scripts) and make the gate detect new modules or functions outside that list in the status/emission area, not any Python change. Add one sentence to FR-027. No operator ruling needed."
  - id: F-2
    severity: 2
    claim: "Retention policy ownership is unspecified. data-model section 6 says the retain request carries the FR-028 policy keys, which implies Python reads .kittify/config.yaml; the keys are validated with a named error (AC-031) but the spec does not say who validates. If Python parses and validates, that is logic in the thin client."
    evidence: "data-model.md section 6 Retain operation and RetentionPolicy; spec.md FR-026, FR-028, AC-031"
    remediation: "Add to FR-028/section 6: Python forwards the raw config values uninterpreted (or none), Java applies defaults 20/30 and validates, returning the named policy error that doctor renders. Acceptable without a ruling."
  - id: F-3
    severity: 2
    claim: "C-008 says the events PR follows #92 for 'type names', which could be read to override operator rulings 4 (prefix ai.spec-kitty, lane.transitioned interim). OD-EVENTS original wording was the same, so no new meaning, but as a constraint it is now stronger."
    evidence: "spec.md C-008; operator-inputs decision 4"
    remediation: "Reword C-008: type names follow #92 except the operator-ruled prefix and interim names, which #92 is asked to adopt. Acceptable without a ruling."
  - id: F-4
    severity: 1
    claim: "Clockless definition covers a present out-of-range value but not a present non-integer lamportclock (null, string); classification as error row is implied by 'outside 0..2^31-1' but not stated."
    evidence: "data-model.md section 4, clockless definition and error rows"
    remediation: "Say 'a present value that is not an integer in 0..2^31-1'."
  - id: F-5
    severity: 1
    claim: "The OD-SIGN text now states macOS/Windows binaries ship unsigned and may trigger Gatekeeper/SmartScreen. This is a true consequence of 'no signing' but wording not itself ruled; harmless addition."
