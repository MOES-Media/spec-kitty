- id: PLAN-SEQ-001
  lens: Phasing - each WP leaves main green
  severity: 4
  title: WP01 adds a pull_request workflow but its fleet-verdict registration is owned by WP09, so WP01
    is red on its own
  evidence:
  - artifact: "plan.md \xA7 11 (WP01 creates event-producer.yml skeleton; WP09 owns fleet verdict registration)\
      \ and \xA7 9 CI home"
  - code: scripts/ci/fleet_verdict.py::PR_WORKFLOWS (closed set) and applicable_workflows raising 'PR
      workflow inventory changed'
  - code: tests/ci/test_fleet_verdict.py::test_all_existing_pr_workflows_are_registered (asserts applicable_workflows(ROOT,
      ...) == PR_WORKFLOWS against the real tree)
  - artifact: tracer-tooling-friction.md ('Easy to miss')
  claim: 'WP01 creates .github/workflows/event-producer.yml with a pull_request trigger. The closed inventory
    test and the fleet verdict script fail on any PR-triggered workflow not in PR_WORKFLOWS, and the registration
    (fleet_verdict.py, ci-fleet-verdict.yml, test_fleet_verdict.py) is assigned to WP09 (eight WPs later).
    WP01 therefore cannot be green or approved on its own gates, contradicting the section 11 claim that
    every WP leaves its lane green. An implementer following the table either ships a red WP01 or edits
    WP09''s chokepoint files. The same ownership split applies to tests/architectural/test_no_duplicate_suite_execution.py
    for the new workflow_call workflow producer-native.yml.

    '
  remediation: 'Move the fleet-verdict registration (fleet_verdict.py, ci-fleet-verdict.yml, test_fleet_verdict.py)
    and any duplicate-suite ledger row for event-producer.yml and producer-native.yml into WP01, the WP
    that creates the workflows; keep WP09 only for release.yml and the nightly call. Update the chokepoint
    sentence in section 11 accordingly.

    '
- id: PLAN-SEQ-002
  lens: Write-scope chokepoints
  severity: 3
  title: WP01 needs the hatch hook and a stub wheel but pyproject.toml and the hook are WP08's sole-owner
    scope, and WP08 depends on WP01
  evidence:
  - artifact: "plan.md \xA7 11 WP01 ('stub wheel with hook'), WP08 ('sole owner of pyproject.toml'; depends\
      \ on WP01), final sentence of \xA7 11"
  - artifact: "plan.md \xA7 3.1 (hook path scripts/release/hatch_build_producer.py, pyproject [tool.hatch.build.targets.wheel.hooks.custom])"
  claim: 'The WP01 exit criterion is that a stub wheel built WITH THE HOOK installs and runs on each OS,
    and section 11 says WP08''s stub-binary wheel build "is exercised in WP01 already". But the hook file
    and the pyproject.toml table are owned by WP08, which runs after WP01. Either WP01 writes the hook
    and edits pyproject.toml (violating the sole-owner rule and creating a WP01/WP08 merge conflict on
    pyproject.toml and scripts/release/) or WP01 exercises a throwaway hook that does not prove WP08''s.

    '
  remediation: 'Assign the hook, its pyproject.toml table and the minimal stub-wheel packaging test to
    WP01 (the risky-first WP), and make WP08 the owner of the remainder (check_dist_set, dist-set.json,
    check_exact_install, shared_build_artifacts, docs); or state that WP01 uses an out-of-tree throwaway
    hook and that WP08 must re-prove all three OS legs with the real one.

    '
- id: PLAN-SEQ-003
  lens: Interaction with
  severity: 3
  title: The four-commit A-D order for status/adapters.py omits the drain-gate move into the Zeitgeist
    handlers, so commit A re-opens hosted fan-out with drain off
  evidence:
  - artifact: "plan.md \xA7 12 (commits A, B, C, D; 'drain gate moves into the three Zeitgeist handlers')\
      \ and \xA7 4.2 row status/zeitgeist_bridge.py"
  - artifact: research.md R-11 hunk list (A to D contains no zeitgeist_bridge.py hunk)
  - code: src/specify_cli/status/adapters.py::fire_saas_fanout, fire_lifecycle_saas_fanout, fire_resolved_binding_fanout
      (drain_posture checks near lines 295, 353, 393)
  claim: 'The only thing preventing the registered Zeitgeist handlers from sending when hosted.drain is
    off is the fire_* drain check. Plan commit A deletes it first; the compensating check in status/zeitgeist_bridge.py
    appears in none of A-D. Between A and the bridge edit, the history contains commits where hosted fan-out
    runs with drain off (C-003 breach, test_hosted_drain_gate red), so A is not an independently green,
    bisectable commit, and an implementer following A-D literally can forget the bridge hunk entirely.
    The plan also does not say that if #6164 lands first the bridge-handler edit becomes a modify/delete
    conflict (resolve by accepting deletion).

    '
  remediation: 'Reorder: commit 1 adds the drain check to the three Zeitgeist handlers (additive, still
    green); commit 2 (A) removes the fire_* gates; then B, C, D. Add to the #6164-first paragraph that
    the zeitgeist_bridge.py hunk and its re-pointed pin test are dropped as deleted-by-them.

    '
- id: PLAN-SEQ-004
  lens: Phasing - dependency order / events-repo release gating
  severity: 3
  title: WP04 mixes schema-independent protocol work with release-gated schema validation, so the whole
    Python critical path (WP06, WP07, WP10) waits on an external release
  evidence:
  - artifact: "plan.md \xA7 11 (WP04 'needs the events release for the contract tests'; WP06 depends on\
      \ WP04; WP07 on WP06) and \xA7 6 'While unreleased'"
  - artifact: "plan.md \xA7 11 last paragraph ('the only legitimate split ... not planned') and WP02 'order\
      \ and fixtures' versus \xA7 6 (comparator spec and the nine fixtures are carried by the events PR)"
  claim: 'Section 6 lists work that can proceed while the events wheel is unreleased and names the protocol,
    but WP04 bundles Produce, the launcher protocol and schema validation in one unit gated on the release.
    WP06 depends on WP04 only for the protocol, yet inherits the gate, so WP06/WP07 (largest Python scope)
    cannot be approved until an event the mission does not control happens. The plan gives no owner, no
    tracking point and no fallback timing for the events release. Separately, WP02 claims "order and fixtures"
    while the authoritative nine fixtures live in the events PR: an implementer either blocks WP02 on
    the release or authors a second fixture set (the parallel set the operator ruled out, decision 7).

    '
  remediation: 'Split WP04 into WP04a (launcher, protocol value types, Produce against a RowSchemaValidator
    port with a test double, fault vocabulary; no release needed) and WP04b (real schema validation and
    contract tests; release-gated). Make WP06 depend on WP04a. State in WP02 that comparator tests use
    the nine data-model section 4 cases as local test data, replaced by the released fixtures in WP04b
    via the same assertions (no copy committed as a schema artefact). Add an explicit events-release milestone
    to the WP table with an owner (orchestrator) and the review point at which it is checked.

    '
- id: PLAN-SEQ-005
  lens: Write-scope chokepoints
  severity: 3
  title: The spec-kitty-events floor bump is bundled in WP08 (pyproject.toml owner) so the release-machinery
    WP chain WP08, WP09 is gated on the unreleased events wheel
  evidence:
  - artifact: "plan.md \xA7 3.2 ('at the floor bump also the events range and uv.lock'), \xA7 6 (pyproject\
      \ floor raised to V_E), \xA7 11 WP08 ('also the events floor bump'; WP09 depends on WP08)"
  - artifact: "research.md \xA7 8 table row check-spec-kitty-events-alignment.yml (triggers at the floor\
      \ bump)"
  claim: 'WP08 is both the packaging hook WP, which should be early and independent, and the only WP allowed
    to edit pyproject.toml, so the events floor bump (impossible before the release, and which trips check-spec-kitty-events-alignment.yml,
    uv.lock and the tests/contract/spec_kitty_events_consumer pin) lands there. Either WP08 and WP09 stall
