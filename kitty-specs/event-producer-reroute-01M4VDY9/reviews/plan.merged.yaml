  lens: release/packaging feasibility (provenance)
  severity: 4
  title: Reusable producer-native.yml is not told which ref to build, so a workflow_dispatch republish
    builds the binary from the dispatching branch, not the release tag
  evidence:
  - artifact: "plan.md \xA7 2 CI shape; \xA7 3.3 step 1 (build-producer 'uses the reusable workflow')"
  - code: '.github/workflows/release.yml::env.RELEASE_REF and build-release ''Check out repository'' (ref:
      ${{ env.RELEASE_REF }}); workflow-level env is not visible inside a called workflow'
  claim: release.yml supports workflow_dispatch with an 'tag' input (github.ref is then the dispatching
    branch). build-release explicitly checks out RELEASE_REF, but the plan's reusable workflow has no
    stated ref input, so its checkout defaults to github.sha. The native binary would then be compiled
    from a different commit than the wheels' Python sources and the tag, while the manifest's 'source
    commit' is only recorded, never compared. Smoke passes, the dist-set check passes, and the published
    binary is not from the tagged source (a provenance and Standing Order 9 integrity hole).
  remediation: Give producer-native.yml a required 'ref' input, pass RELEASE_REF from release.yml (and
    github.sha from event-producer.yml), check out that ref, and add a build-release step that fails unless
    every producer-manifest.json 'source commit' equals 'git rev-parse HEAD' of the release checkout.
    Pin the 'build-producer ref input' in test_release_ci_ownership.py.
- id: PLAN-RELEASE-003
  lens: release/packaging feasibility (dist-set equality)
  severity: 3
  title: Platform wheel tags are both 'measured from the binary' and 'pinned in dist-set.json'; the two
    disagree on a first real release
  evidence:
  - artifact: "plan.md \xA7 2 table (tag 'measured from the binary's glibc symbols', macOS 'measured minos');\
      \ \xA7 3.2 (dist-set.json pins the expected list of tags); \xA7 3.3 step 2 (check_dist_set.py: set\
      \ equals dist-set.json)"
  - code: scripts/release/ has no check_dist_set.py yet; hatchling takes the tag verbatim from build_data['tag']
  claim: A binary built in a manylinux_2_28 container typically needs a lower maximum GLIBC_ symbol (for
    example 2.17) than 2.28, and a macOS binary's minos depends on how native-image passes the deployment
    target. If the hook derives the tag from the measurement, the wheel name will not equal the pinned
    manylinux_2_28/macosx_11_0 tag and check_dist_set.py (the release gate) fails on the first tag; if
    it uses the pinned tag, the 'measured' claim is decoration. The plan does not say which one governs.
  remediation: "Make dist-set.json the single authority for the tag (the floor) and turn the measurement\
    \ into an assertion: fail the leg when the measured maximum GLIBC_ version exceeds the pinned manylinux\
    \ floor or the measured minos exceeds the pinned macOS floor. Say so in \xA7 2 and give the hook the\
    \ tag from dist-set.json, not from the binary."
- id: PLAN-RELEASE-005
  lens: release/packaging feasibility (toolchain install)
  severity: 3
  title: contracts/tools/install_tools.py cannot install the per-OS GraalVM archives the plan puts in
    tools/pins.json, yet is described as 'reused unchanged'
  evidence:
  - artifact: "plan.md \xA7 1 Build (install_tools.py --pins services/event-producer/tools/pins.json --only\
      \ gradle, reused unchanged); \xA7 2 Toolchain pin (GraalVM archive URL and sha256 in tools/pins.json)"
  - code: contracts/tools/install_tools.py::_unpack_tool, _unpack_tarball (one url per tool, no per-OS
      selection; a .tar.gz must hold its declared 'binary' at the archive root; a .zip adds <top>/bin
      to PATH)
  claim: The installer has one URL per tool and assumes either a zip with <top>/bin or a tarball with
    the binary at its root. A GraalVM JDK is a .tar.gz with a top directory on Linux, Contents/Home/bin
    on macOS, and a .zip on Windows, so none of the three layouts installs and there is no per-OS entry.
    Gradle (--only gradle) works; GraalVM does not. The sentence 'verified before unpack, reused unchanged'
    therefore does not cover the native toolchain, the one artifact whose provenance matters most.
  remediation: "Decide in the plan how GraalVM is installed on each leg: either a SHA-pinned setup action\
    \ plus a post-install step that compares the archive sha256 and 'native-image --version' to pins.json,\
    \ or an explicit extension of install_tools.py (per-OS url/sha256 map, JDK layouts) with its tests;\
    \ list the file in \xA7 3.2/\xA7 1 and the tests it touches. Do not claim 'unchanged' for GraalVM."
- id: PLAN-RELEASE-006
  lens: release/packaging feasibility (Windows native)
  severity: 3
  title: gethostname via ws2_32 returns WSANOTINITIALISED in a native image that never initialised Winsock
  evidence:
  - artifact: "plan.md \xA7 7 nodeid (hostname through an FFM downcall to ws2_32 on Windows); \xA7 2 WP01\
      \ exit criteria; \xA7 16 unverified (Windows/Java hostname agreement)"
  claim: Python's socket module calls WSAStartup at import, which is why Python's gethostname works. A
    GraalVM native binary that does not load the JDK networking library has no WSAStartup call; ws2_32!gethostname
    then fails (-1, WSANOTINITIALISED) and the nodeid, the sha256 of hostname:username, is wrong or throws,
    breaking AC-039 on the Windows leg only, which WP01 will find but the plan has no stated remedy for.
  remediation: "In \xA7 7 and the WP01 exit criteria, specify calling WSAStartup (version 2.2) once through\
    \ the same FFM downcall before gethostname (and WSACleanup), or use GetComputerNameExW(ComputerNameDnsHostname)\
    \ and prove equality with Python's value in the live AC-039 test. Record the choice before WP03."
- id: PLAN-RELEASE-007
  lens: release/packaging feasibility (wheel parity)
  severity: 3
  title: The pure wheel is built from the sdist but the platform wheels from the (test-mutated) checkout,
    with no parity check between them
  evidence:
  - artifact: "plan.md \xA7 3.1 ('platform wheels are built from the checkout'), \xA7 3.3 step 2 (python\
      \ -m build --wheel --outdir dist per platform)"
  - code: .github/workflows/release.yml::build-release ('Run tests' runs tests/release before 'Build distributions';
      the 'Verify wheel contents' comment says release tests can mutate the checkout); 'python -m build'
      default builds the wheel from the sdist
  claim: python -m build (default) produces the pure wheel via sdist-to-wheel, while the platform wheels
    are built directly from a working tree that tests/release has already run in. Hatchling honours .gitignore
    but not untracked non-ignored debris, so a platform wheel can contain files the pure wheel (and the
    tested wheel) does not, or miss tracked content the sdist include list pulls in. The four wheels are
    advertised as the same product; nothing proves it.
  remediation: Add a check in check_dist_set.py (or a build-release step) that, for every platform wheel,
    member list and per-member sha256 equal the pure wheel's except the three _native/ members and METADATA/WHEEL/RECORD;
    alternatively build platform wheels in a clean 'git worktree'/clean checkout step. Add the mutation
    (one extra file) to the dist-set tests.
- id: PLAN-RELEASE-008
  lens: Java-only rule consistency (fork F1)
  severity: 3
  title: Fork F1 lists two Python files but the plan's release machinery needs more Python, so the operator
    would rule on an understated scope
  evidence:
  - artifact: "plan.md \xA7 16 F1 (hook + check_dist_set.py only); \xA7 2 (measuring glibc symbols and\
      \ minos, producer-manifest.json, 'smoke script' on three OS); \xA7 3.2 (check_dist_set.py --verify-binaries\
      \ re-hashing wheel members, edits to check_exact_install.py)"
  - code: scripts/release/ currently holds only Python (check_exact_install.py, validate_release.py, ...)
  claim: The Java-only ruling excepts thin pass-through shims of the strangler; a build hook, hash-verifying
    set-check, tag-measuring step, manifest writer and smoke script are release tooling that is neither
    Java nor a strangler shim. F1 recommends option (a) ('no product logic') but --verify-binaries and
    manifest handling are security-relevant verification logic, and the manifest writer/tag measurement
    have no stated language at all. The fork is therefore decided on an incomplete list, and option (b)'s
    dismissal ('adds a JVM dependency to the Python release path') ignores that build-release already
    needs the producer artifacts and could run a Gradle task from a JDK it sets up.
  remediation: Enumerate in F1 every new non-Java file (hook, check_dist_set.py with --verify-binaries,
    manifest writer and tag measurement, smoke script, check_exact_install.py edits) and state, per file,
    whether it can be Java (Gradle task or the launcher itself emitting its manifest) and what cost; keep
    the hook as the only unavoidable Python file in the recommendation, or get the operator ruling on
    the full list.
- id: PLAN-RELEASE-009
  lens: release/packaging feasibility (Linux container leg)
  severity: 2
  title: Building in a manylinux_2_28 container from a GitHub Actions job needs more than a pinned image
  evidence:
  - artifact: "plan.md \xA7 2 table (ubuntu-24.04, build in a pinned manylinux_2_28 container); research.md\
      \ \xA7 2 per-OS recipe"
  claim: JavaScript actions (checkout, upload-artifact, setup-java, the SHA-pinned MSVC/attest actions
    where used) run inside the container with the runner's Node, which needs a compatible glibc, and the
    image needs git, a C toolchain and zlib-devel for native-image. The plan names only the image digest
    and a musl fallback; WP01 would find each of these piecemeal.
  remediation: Add to the WP01 exit criteria that the container leg runs checkout and upload-artifact
    inside the image (or builds with docker run on a host checkout) and lists the installed build prerequisites
    in pins.json; keep the musl fallback decision recorded as stated.
- id: PLAN-SHIM-001
  lens: allowed-surface gate testability (FR-027)
  severity: 4
  title: Gate cannot detect a new function in an existing allowed file, so the FR-027 "other new module
    or function" clause is untestable as designed
  evidence:
  - artifact: "plan.md \xA7 4.2 (gate paragraph, rules (a) and (c)); spec.md FR-027, AC-012"
  - code: src/specify_cli/status/emit.py, src/specify_cli/status/lifecycle_events.py, src/runtime/next/_internal_runtime/engine.py
      (listed in the 4.2 table by symbol, but never symbol-pinned by the gate)
  claim: 'Rule (a) pins the exact top-level symbol set only for the three NEW modules; rule (c) is a module-level
    census. The 4.2 table lists allowed symbols in about a dozen EXISTING files, but nothing checks them.
    A WP agent can add an id-minting, row-building or validation helper inside emit.py, lifecycle_events.py
    or engine.py and every rule passes. That is the main route by which logic leaks into Python, and AC-012
    ("new Python logic outside the allowed surface of FR-027 fails") has no mutation that would catch
    it (the listed mutations all target "a copy" of the client).

    '
  remediation: 'Add rule (e): for every existing file in the 4.2 table, pin the full AST set of top-level
    functions, classes and methods at the base commit plus the table''s allowed new names; a new name
    fails. Add a floor (all table files found, set sizes above zero) and a self-mutation case that adds
    a helper (for example _mint_id) to a copy of emit.py and must fail. State in 4.2 that the table''s
    "changed" symbols may change bodies but not gain callees from uuid/ulid/hashlib/datetime (extend the
    import-allowlist rule to those hunks, or pin the import set of each file).

    '
- id: PLAN-SHIM-002
  lens: allowed-surface gate testability (FR-027)
  severity: 3
  title: Thinness gate bans json.loads outside the reply reader, but fault_summary and the doctor window
    must parse the fault log
  evidence:
  - artifact: "plan.md \xA7 4.1 (fault_summary, count and last class for doctor), \xA7 4.2 gate rule (a)\
      \ 'no json.loads outside the reply reader', \xA7 8 doctor rendering"
  - artifact: data-model.md FaultLogRow (doctor derives count and last class from fault rows, notices
      counted apart)
  claim: 'Counting fault rows (not notice rows) in the retention window and reporting the last class requires
    reading and decoding the fault-log JSONL in Python. Rule (a) forbids json.loads anywhere but the reply
    reader, and the exact top-level symbol set per module is pinned to the table, which lists no fault-log
    reader. An implementer must either break the gate, hide the parse (eval/regex), or push the count
    into Java (not in the protocol). The "window" is also undefined on the Python side: it is the file-age
    window of Java''s retention policy, but Python holds no policy.

    '
  remediation: 'Name the second allowed decode site in the 4.1/4.2 table (a single function such as producer_faults._read_fault_rows)
    and permit json.loads there only. Define the Python window as file-name dates compared to today with
    the raw max_age_days forwarded, or have doctor ask Java (a read-only `faults` field in the retain
    dry-run reply) so Python only renders. Pick one and state it; add it to the gate''s floor and mutation
    cases.

    '
- id: PLAN-SHIM-003
  lens: seam can carry the client as described
  severity: 3
  title: Seam busy and timeout branches would record producer faults for every handler, including the
    Zeitgeist handler
  evidence:
  - artifact: "plan.md \xA7 4.2 table row status/adapters.py ('busy and timeout branches call record_fault');\
      \ spec.md FR-023 last sentence"
  - code: src/specify_cli/status/adapters.py::fire_saas_fanout, fire_lifecycle_saas_fanout (the except
      _FanoutHandlerBusyError / except TimeoutError branches sit inside the generic 'for handler in _saas_handlers'
      loop)
  claim: 'The loop is shared by all registered handlers. With drain on, a slow Zeitgeist handler (a real,
    bounded 10 s case) would be recorded as a producer fault with class timeout or busy, with a stderr
    warning saying the event was not produced, though the producer was never involved. The plan does not
    say how the branch knows the dropped handler was the client''s. The `except Exception` branch is not
    listed, which is fine only if the client is a total catch; that is stated nowhere in the plan.

    '
  remediation: 'In 4.2 state that the branches call record_fault only when the dropped handler is the
    client''s (compare _handler_key(handler) with the client handler''s key, or give the client handler
    an attribute the branch reads), and add the Zeitgeist-timeout case to AC-006''s tests (no producer
    fault row). State that the client handler never raises (outermost catch) so the generic except branch
    needs no change.

    '
- id: PLAN-SHIM-004
  lens: Python-shim minimality and seam carrying
  severity: 3
  title: Client timeout rule is undefined for small seam bounds and requires importing a private function
    from adapters (cycle)
  evidence:
  - artifact: "plan.md \xA7 4.1 (effective_client_timeout reads status.adapters._saas_fanout_timeout_s),\
      \ \xA7 5 Timeouts ('capped at bound - 1.0 s when the bound is smaller')"
  - code: src/specify_cli/status/adapters.py::_saas_fanout_timeout_s (private; accepts any finite float
      from SPEC_KITTY_SAAS_FANOUT_TIMEOUT, including values in (0, 1] and non-positive values which run
      the handler inline)
  claim: 'For a bound of 1.0 the cap yields 0 and for 0.5 a negative timeout; the plan gives neither a
    floor nor a behaviour, so an implementer will pass a zero or negative deadline_ms (every row times
    out, or an immediate exit 75). For a disabled bound (<= 0) the plan says only that the client still
    applies its own timeout (3.0 s default). Separately, the client importing a private name from adapters.py,
    which in turn imports the client in ensure_producer_client, is a circular import and trips the SR-2
    facade rule the plan cites in section 9.

    '
  remediation: 'Specify the function completely: bound <= 0 gives the default; 0 < bound <= 1.0 gives
    bound/2 (or a stated floor such as 50 ms); otherwise min(default, bound - 1.0). Add boundary cases
    to AC-006 (0.5, 1.0, 1.5, 0, negative). Have adapters.py inject the bound resolver into ensure_producer_client(bound=_saas_fanout_timeout_s)
    so the client imports nothing from adapters and the private name stays private.

    '
- id: PLAN-SHIM-005
  lens: protocol keeps the client uninterpreting
  severity: 2
  title: seam_args are serialised with default=str, so objects such as WPStatusChangeMetadata reach the
    child as repr strings; no consumer is specified
  evidence:
  - artifact: "plan.md \xA7 5 Operations (seam_args); research.md protocol shape (json.dumps default=str);\
      \ data-model.md ProduceRequest"
  - code: src/specify_cli/status/emit.py::_saas_fan_out (passes metadata=WPStatusChangeMetadata.from_status_event(...)
      and repo_root=Path)
  claim: 'FR-004 says the producer reads the row only. seam_args carries a dataclass repr (possibly with
    object addresses, absolute paths) that no Java type reads; it adds nondeterministic bytes to the request,
    widens the surface for NFR-006 leaks into the child, and invites a future "small" Python serializer
    for it (interpretation).

    '
  remediation: 'Either drop seam_args from protocol v1 (keep row, slot, start_path, deadline_ms), or pin
    it to JSON-native scalar kwargs only (wp_id, from_lane, to_lane, mission_slug, mission_id) chosen
    by an explicit list in 4.2. Also state which kwarg is start_path (repo_root) and what the client sends
    when it is None (the plan should say the client sends null and Java refuses with root-unresolvable,
    not the process working directory).

    '
- id: PLAN-SHIM-006
  lens: fault recording is not logic creep
  severity: 2
  title: Client must stamp fault-row time and the UTC day file name, which FR-026 and AC-012 forbid ("timestamps");
    the carve-out is only in the plan
  evidence:
  - artifact: "plan.md \xA7 4.2 gate (a) 'no datetime outside producer_faults.py'; \xA7 15 touch-ups (no\
      \ FR-026 amendment); data-model.md fault log path (UTC date of the fault's at)"
  - artifact: spec.md FR-026 ('must not ... mint ids, timestamps or clocks'), AC-012 (mutation adds a
      timestamp)
  claim: 'The fault log file is named by the UTC date of the fault''s at, so Python must read the clock.
    The plan permits this in one module but the spec still forbids it, and AC-012''s timestamp mutation
    is ambiguous about which module it targets. Inconsistent contract text invites either a failing gate
    or a second, hidden clock helper.

    '
  remediation: 'Add a spec touch-up in section 15: FR-026 allows the client to read the wall clock for
    the fault row''s own `at` and the day file name only, never for an event. State in AC-012 that the
    timestamp mutation is applied to producer_client.py (not producer_faults.py) and that producer_faults.py
    has a second mutation (a clock read feeding anything but the fault row). Keep the single-writer rule
    for fault rows as already planned.

    '
