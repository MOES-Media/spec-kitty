    '
- id: PLAN-SEQ-006
  lens: Phasing - risky work front-loaded / PR shape
  severity: 3
  title: The release.yml wiring (needs edges, publish-pypi gating, dist-set check, build-release wheel
    loop) is only exercised on a real tag, and sits late in WP09
  evidence:
  - artifact: "plan.md \xA7 3.3 (all changes inside release.yml; smoke-wheels is a release.yml job), \xA7\
      \ 9 CI home, \xA7 11 (WP09 after WP08, one PR)"
  - code: '.github/workflows/release.yml (on: push tags ''v*.*.*'' and workflow_dispatch of an existing
      tag; publish-pypi job publishes to PyPI)'
  - code: tests/release/test_release_ci_ownership.py (static text pins only)
  claim: 'release.yml triggers only on a tag or dispatch of an existing tag, and the same run publishes.
    Pull-request CI exercises native-smoke (event-producer.yml), but not the new job graph, the assemble-all-wheels
    steps, check_dist_set against the real artifacts, or the publish-pypi needs/if condition with two
    predecessors. Those edits are guarded only by static text tests, and their first real execution is
    a release attempt, i.e. the highest-risk change is validated last and live. In a single PR with no
    slices nothing else catches it.

    '
  remediation: 'Put the wheel-assembly steps (download, recompute sha256, build per-leg wheel, check_dist_set,
    check_exact_install per tag) in one script or composite action called by BOTH release.yml and event-producer.yml,
    so PR CI runs the same assembly on the real three-leg artifacts. Add to WP09/WP10 a rehearsal on a
    pre-release tag or dispatch path that stops before publish-pypi, with the evidence recorded, and a
    workflow-level mutation test that publish-pypi lacks the new needs edge when removed.

    '
