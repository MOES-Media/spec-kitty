    lens: Dependency tracking (FR-014 / FR-040)
    severity: 2
    title: The external events PR that blocks WP07, WP09, WP10, WP11 approval has no task, owner or tracker reference in wps.yaml
    evidence:
      - artifact: "plan.md § 6 (orchestrator opens it); tasks-overview.md § 2 (external, not a WP)"
      - artifact: "tasks/WP11 T071 only checks for a released wheel; wps.yaml has no tracker_refs for it"
    claim: >
      FR-014's content list (schemas, registry file, comparator specification, nine fixtures, Lane alignment, conditional
      envelope subset) is entirely outside this mission's tasks. Nothing records who delivers it or what happens if the events
      maintainers reshape it; WP11 T075 produces only the 'confirmation list'. Four of eleven WPs depend on it.
    remediation: >
      Add a tracker reference (issue or Op id) to WP11 and the overview, and a checklist in T071 of the FR-014 items the
      released wheel must contain (including the registry file name WP11 will read, plan 17 'unverified').
  - id: TASKS-COVER-014
    lens: AC traceability (AC-012 mutation list)
    severity: 2
    title: T039 lists fewer client mutations than AC-012 requires and omits the positive capability checks
    evidence:
      - artifact: "spec.md § AC-012: mutated client adds an id mint, timestamp, schema import, log read or the bridge envelope code; the other FR-026 capabilities must pass"
      - artifact: "tasks/WP06 T039 self-mutations: id mint, clock outside _now_utc, import uuid in emit.py, secrets in engine.py/rebuild_state.py"
