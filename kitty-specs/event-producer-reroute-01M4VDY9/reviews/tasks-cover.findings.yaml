  - id: TASKS-COVER-012
    lens: FR-027 allowed surface vs task text
    severity: 3
    title: T042 'path literals in one constants module' introduces an unlisted module the thinness gate would reject
    evidence:
      - artifact: "tasks/WP06 T042; plan.md § 4.2 (complete list of Python changes; gate (c) pins the emission-area module census; gate (a) pins exact top-level symbols of the three modules)"
      - artifact: "spec.md § FR-027: the gate fails on any other new module or function in the status and emission area"
    claim: >
      T042 asks for a constants module that is in no row of plan 4.2, in no owned_files list and in no gate (c) pinned list.
      Either the gate fails the WP, or the implementer widens the list silently. The same ambiguity applies to the
      'decide StateRoot/GIT_COMMON_DIR handling' text: state/contract.py already has StateRoot.GIT_INTERNAL anchored at .git/spec-kitty/
      (src/specify_cli/state/contract.py:36), which is not the git common directory for a linked worktree.
    remediation: >
      Rewrite T042 so the path constants live in producer_faults.py (or producer_client.py) within the table's symbol set, and
      state the decision for the clock-state surface (existing GIT_INTERNAL root with a documented common-dir note, or a new
      enum member, which would itself need a plan 4.2 row).
