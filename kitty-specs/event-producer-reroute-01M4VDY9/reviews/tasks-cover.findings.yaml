  - id: TASKS-COVER-015
    lens: Spec touch-up 7 (retain failures are not event faults)
    severity: 2
    title: No test asserts that retain failures stay out of the fault log and fault count
    evidence:
      - artifact: "spec.md § FR-023 last sentence; research.md § 18 item 7"
      - artifact: "tasks/WP06 T041 (renders the reply)"
    claim: >
      T041 renders policy_error and kept-with-reason but nothing checks that a retain crash/timeout or policy_error writes no fault-log
      row and does not move the doctor fault count.
    remediation: >
      Add to T041 a test: retain with policy_error, and with a stubbed crash, produces a rendered error, zero fault-log rows,
      unchanged fault_summary.
  - id: TASKS-COVER-016
    lens: File references real (ownership and create_intent)
    severity: 2
    title: Owned-file and create_intent markings disagree with what the tasks edit
    evidence:
      - artifact: "tasks/WP02, WP03, WP05 frontmatter: create_intent: [] while every owned path is absent on this checkout (e.g. services/event-producer/domain/src/main/**)"
      - artifact: "tasks/WP07 T046 edits src/runtime/next/_internal_runtime/engine.py (stamping) but WP07 owned_files omit it; overview R2 excuses only 'marker comment removal'"
      - artifact: "tasks/WP06 T038 edits tests/runtime/test_bridge_engine.py, not in WP06 owned_files; tasks/WP01 T002 edits scripts/release/README.md, owned by WP08"
      - artifact: "tasks/WP07 T047/T046 edit tests/architectural/test_producer_client_thinness.py, not in WP07 owned_files"
    claim: >
      The core FR-035 deliverable (the only flagged Python modification) edits a file WP07 does not own, and three more
      edits sit outside the owning WP's list. Greenfield Java trees are not marked as created. Reviewers and the ownership
      validator then see out-of-map edits that the overview does not enumerate.
    remediation: >
      List engine.py, test_bridge_engine.py, the thinness gate file and scripts/release/README.md as recorded out-of-map edits in
      overview R2 (each with the dependency-order justification), or add them to owned_files after resolving the lane merge;
      add the new Java source globs to create_intent of WP02, WP03, WP04, WP05, WP11.
  - id: TASKS-COVER-017
    lens: Red-first / revert-check statements
    severity: 2
    title: WP08 and WP10 do not state the revert-check; the -PeventsWheel refusal under CI has no test
    evidence:
      - artifact: "plan.md § 9 Method: every behaviour is revert-checked; WP09 and WP11 Gates restate it"
      - artifact: "tasks/WP08 Gates ('Red-first with mutation cases'), WP10 Gates ('All of the above'); plan.md § 6 '-PeventsWheel is refused when CI is set'; tasks/WP11 T072 mentions it without a test"
    claim: >
      Only the overview carries the generic rule for these two WPs, and the one guard that keeps a local wheel out of CI
      (refusal when CI is set) is a security-relevant behaviour with no stated test.
    remediation: >
      Add the revert-check sentence to WP08 and WP10 Gates and a red-first test to T072 (Gradle run with CI=true and -PeventsWheel fails).
