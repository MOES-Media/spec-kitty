findings:
- id: TASKS-DECOMP-002
  lens: WP single-concern and reviewable in one sitting
  severity: 3
  title: WP07 mixes four unrelated concerns and gates the ungated ones behind the external events release
  evidence:
  - artifact: tasks/WP07-journal-stamping-lanes-markers-docs.md title and T045, T046, T047, T049, T050
  - artifact: wps.yaml WP07 dependencies [WP06, WP11]; tasks-overview.md section 2 (WP07 gated)
  - code: src/specify_cli/migration/rebuild_state.py:144 (_VALID_LANES), src/specify_cli/acceptance/__init__.py:151,
      src/specify_cli/consolidation/done_bookkeeping.py:36
  claim: 'WP07 holds (a) lane-list consolidation (FR-034), which touches three production modules and
    reads no schema, (b) run-journal stamping plus thinness gate rule (b) (FR-035), (c) marker clearing
    and persisted-line lint mode that validates against released schemas (FR-032/033), and (d) glossary,
    Contextive and ADR edits (FR-045/046). Only (c) needs the released events wheel (T047 validates against
    the installed package). Because the whole WP depends on WP11 and its first task blocks it, (a), (b)
    and (d) cannot even be started, reviewed or approved until a foreign repo releases. The WP title is
    a list of four nouns, the tell of more than one concern.

    '
  remediation: 'Split into WP07a "Lane-list consolidation and run-journal stamping with gate (b)" (T045,
    T046, depends WP06, ungated) and WP07b "Marker clearing, glossary, ADRs" (T047, T049, T050; depends
    WP07a and WP11, gated; T044 precondition lives here). Alternatively move glossary and ADRs (T049,
    T050) into the ungated WP07a. Update the chokepoint table accordingly.

    '
  refute_reason: wps.yaml gives WP07 dependencies WP06 and WP11 and T044 blocks the whole WP, though only
    T047 needs the released events wheel; lane consolidation, journal stamping and glossary/ADR work are
    gated needlessly (severity more like 2 to 3).
- id: TASKS-DECOMP-004
  lens: Descriptions concrete enough to implement
  severity: 4
  title: No WP owns the launcher composition root that binds the real schema validator, and native-image
    metadata for the real producer is unowned
  evidence:
  - artifact: tasks/WP04-java-produce-and-protocol.md Context ('Produce takes the RowSchemaValidator port;
      tests use a fake') and T028 ('real ports')
  - artifact: tasks/WP11-events-release-consumer.md T072, T073 (owns adapter/schema/** only; embeds schemas
      as native-image resources)
  - artifact: 'wps.yaml: launcher/src/main/java/.../launcher/*.java owned by WP04; META-INF/native-image/**
      owned by WP01; WP11 owns no launcher or build file'
  - artifact: plan.md section 1 table (:application row) lists the ports but names no wiring owner
  claim: 'WP04 writes the launcher entry using a fake validator; WP11, which runs after WP04 and owns
    only adapter/schema/**, writes the real RowSchemaValidator. Nothing says which WP edits the launcher
    main to construct the schema adapter in place of the fake, nor which WP updates reachability/resource
    metadata (Jackson, schema resources, FFM) for the real producer, which META-INF/native-image/** (WP01)
    cannot anticipate. The likely outcomes are a launcher that wires an accept-all validator (AC-001 and
    AC-002 pass vacuously in WP04, the real binary validates nothing until WP10 notices) or an out-of-map
    edit nobody reviews.

    '
  remediation: 'Assign it explicitly: add launcher/src/main/java/.../launcher/Wiring.java (or the existing
    entry) and the native-image metadata directory for the real producer to WP11''s owned_files, add a
    WP11 subtask ''Bind schema adapter in launcher; native build resolves schemas'' with the outcome ''launcher
    test with an invalid row replies rejected using the released schema'', and state in WP04 T023/T028
    that the default binding before WP11 is a validator that fails closed (refuses), never accept-all.

    '
  refute_reason: WP04 owns the launcher entry using a fake RowSchemaValidator and WP11 owns only adapter/schema
    and gradle files, and no plan or WP text names who binds the real validator in the launcher or what
    the pre-WP11 default is (grep for wiring, composition or fail-closed found nothing).
- id: TASKS-DECOMP-005
  lens: Descriptions concrete enough to implement
  severity: 3
  title: Out-of-map edits are required by subtasks but not declared in owned_files or in the chokepoint
    table
  evidence:
  - artifact: 'tasks/WP06 T038: ''Fakes in tests/runtime/test_bridge_engine.py gain the method'' (file
      not in WP06 owned_files)'
  - code: tests/next/test_mission_run_back_reference.py:233 (_NullSyncEmitter), tests/next/test_internal_runtime_coverage.py:280
      (ZeitgeistRuntimeEmitterProducer), tests/next/test_runtime_bridge_unit.py:625 (FakeEmitter) implement
      the emitter surface and are unowned
  - artifact: tasks/WP03 T021 edits .github/workflows/event-producer.yml (WP01-owned, absent from chokepoint
      table)
  - artifact: tasks/WP05 T032 two-process produce/retain test and T033 launcher tests; launcher/src/test/**
      is WP04-owned
  - artifact: tasks/WP07 T046/T047 edit engine.py, test_producer_client_thinness.py and marker files owned
      by WP06
  claim: 'Overview R2 admits some out-of-map edits, but these are not listed. In particular WP06 changes
    the RuntimeEventEmitter Protocol (events.py:83-97 lists the eight emit_* methods) and only the test_bridge_engine
    fakes are named; the other fakes above would raise AttributeError if the engine path under test reaches
    emit_decision_authority_denied, and no WP owns them. WP05''s launcher race test has no home under
    its own owned_files.

    '
  remediation: 'Add to WP06 owned_files tests/runtime/test_bridge_engine.py plus a census subtask step
    ''grep every class defining emit_significance_evaluated under tests/ and src/ (known: tests/next/test_mission_run_back_reference.py,
    tests/next/test_internal_runtime_coverage.py, tests/next/test_runtime_bridge_unit.py, tests/runtime/test_bridge_decision_log_flush.py)
    and add the method or prove the path is not reached''. Add launcher/src/test/java/.../retain/** to
    WP05 and event-producer.yml to the chokepoint table for WP03. In WP07 frontmatter note engine.py and
    the thinness test as recorded second-editor edits.

    '
  refute_reason: T038 says fakes in tests/runtime/test_bridge_engine.py gain the method but that file
    is absent from WP06 owned_files in wps.yaml; the other cited fakes already lack emit_significance_evaluated
    so they are not shown to break, which lowers severity to 2.
- id: TASKS-DECOMP-006
  lens: Descriptions concrete enough to implement
  severity: 3
  title: WP07 T048 (FR-036/FR-037) names no file, test or verifiable outcome
  evidence:
  - artifact: 'tasks/WP07 T048: ''gate/test that the Python readers ... are unchanged in behaviour and
      no legacy row is rewritten'''
  - artifact: wps.yaml WP07 owned_files has no test dedicated to reader immutability
  claim: 'The step says ''gate/test'' without choosing one, names no file to create, and defers the real
    check to WP10 T066. As written a WP07 implementer can close T048 with no artifact, leaving FR-036
    and FR-037 covered only on paper in this WP.

    '
  remediation: 'Replace with: add tests/specify_cli/migration/test_rebuild_state.py case that feeds a
    pre-stamp legacy run.events.jsonl through the readers and asserts byte-identical file afterwards and
    identical reduced output; or state explicitly ''no WP07 code; covered by WP10 T066'' and drop FR-036/FR-037
    from WP07 requirement_refs.

    '
  refute_reason: WP07 T048 says gate/test with no file or assertion and itself defers the real byte-identity
    check to WP10, so FR-036 and FR-037 have no WP07 artifact; severity 2 is more apt.
- id: TASKS-DECOMP-007
  lens: No padding or vacuous tasks
  severity: 2
  title: Precondition subtasks T044, T058, T064, T071 are pure checks with no deliverable; T064 has no
    steps at all
  evidence:
  - artifact: tasks/WP07 T044 'No code.'; WP09 T058 'No code.'; WP10 T064 (heading only); WP11 T071
  claim: 'Four of 77 subtasks are gates that produce no file. They are legitimate halt conditions, but
    counted as subtasks they pad the T-numbering and have no verifiable outcome; T064 is an empty heading.

    '
  remediation: 'Fold each into the WP''s ''Precondition gate'' section (already present) and drop the
    subtask, or give each a recorded outcome (a line in the WP notes naming V_E and the pin sha256, checked
    by the reviewer). Fill or delete T064.

    '
  refute_reason: WP07 T044 is 'No code.', WP09 T058, WP10 T064 and WP11 T071 are check-only subtasks,
    and T064 has a heading with no steps at all (verified in WP10), though this is a nit given the Precondition
    gate sections.
- id: TASKS-SEQ-001
  lens: order
  severity: 4
  title: WP03 (adapters) is sequenced before WP04 (the ports the adapters implement)
  evidence:
  - artifact: "plan.md \xA7 1 (module table: :application holds ports PublishLog, ClockStore, RepoLocator,\
      \ NodeIdentity, Clock; :adapter may depend on :application)"
  - artifact: "wps.yaml \xA7 WP03 (dependencies [WP02]; owned_files only adapter/**) and \xA7 WP04 (owns\
      \ application/port/**)"
  - artifact: "tasks/WP04-java-produce-and-protocol.md \xA7 T023 ('Ports in application.port: RowSchemaValidator,\
      \ PublishLog, ClockStore, RepoLocator, NodeIdentity, Clock')"
  - artifact: tasks/WP03-java-adapter-filesystem.md (no mention of any port interface; subtasks T017-T022
      build lock, clock store, publish log, repo locator, node identity)
  claim: 'The module layout makes :adapter depend on :application and implement its ports, but the ports
    are authored in WP04, one WP AFTER the adapters. WP03 depends only on WP02 (:domain), so its classes
    cannot declare ''implements PublishLog/ClockStore/RepoLocator/NodeIdentity'' at all. Either WP03 writes
    free-standing classes and WP04 must later edit WP03-owned adapter files to add the implements clauses
    (an ownership violation and a hidden rework), or WP03 invents its own interfaces that WP04 then has
    to reconcile. The plan section 11 graph has the same inversion; the tasks author inherited it and
    did not flag it as a refinement (R1-R3 only cover WP05).

    '
  remediation: 'Move the interface-only port package (application/port/** minus RowSchemaValidator if
    it must wait for WP11''s adapter, which can stay a WP04 port) into WP03 (add it to WP03 owned_files
    and a first red-free subtask ''ports as interfaces''), make WP03 depend on the :application build
    skeleton (already WP01), and keep WP04 for Produce, protocol and launcher. Record it as refinement
    R4 in tasks-overview.md section 3. Alternative: reorder so the ports land in WP02 (domain-adjacent,
    interface only) and the ArchUnit :application rule stays in WP04.

    '
  refute_reason: plan section 1 puts ports in :application with :adapter depending on it, wps.yaml gives
    application/port/** to WP04 while WP03 (depends on WP02 only) builds the adapters, and WP03 prompt
    names no port interfaces, so the inversion is real (severity 4 is arguably 3).
- id: TASKS-SEQ-002
  lens: seq
  severity: 4
  title: Native-image reachability metadata and spike removal have no owner after WP01
  evidence:
  - artifact: "wps.yaml \xA7 WP01 owned_files (launcher/src/main/java/.../launcher/spike/**, launcher/src/main/resources/META-INF/native-image/**)"
  - artifact: "wps.yaml \xA7 WP04 owned_files (launcher/src/main/java/.../launcher/*.java, launcher/src/test/**\
      \ only)"
  - artifact: "tasks/WP04-java-produce-and-protocol.md \xA7 T023 ('first commit deletes WP01's launcher/.../spike/**\
      \ and its native-image entries only if superseded')"
  - artifact: "tasks/WP11-events-release-consumer.md \xA7 T072 (schemas 'embedded as native-image resources')"
  - artifact: tasks/WP03-java-adapter-filesystem.md Risks (FFM availability in the native image 'proved
      in WP01')
  - artifact: "tasks/WP01-feasibility-gate-and-build-skeleton.md \xA7 T007 (native-smoke job runs on every\
      \ PR via event-producer.yml)"
  claim: 'The real producer needs native-image metadata that the spike cannot have: Jackson record/DTO
    reflection (WP03/WP04), the FFM downcall descriptor for nodeid (WP03), and resource-config for the
    schemas and registry (WP11). Every one of those files lives under META-INF/native-image/**, owned
    only by WP01. No later WP lists it, yet native-smoke (WP01 T007) builds the real launcher on all three
    OS for every path-matching PR, so a WP that adds reflected classes without metadata turns the gate
    red. WP04 is also told to delete WP01-owned spike/** files it does not own. A required file is owned
    by an earlier WP, which is the ''no WP''s required file is owned by a later/earlier-and-closed WP''
    defect the sequencing lens exists to catch.

    '
  remediation: 'Either give the metadata a per-WP location (each WP owns its own file, for example META-INF/native-image/ai.speckitty/producer-<wp>/reflect-config.json,
    merged automatically by native-image) and add that path to WP03, WP04 and WP11 owned_files, or declare
    META-INF/native-image/** and spike/** as a serial chokepoint in tasks-overview.md section 4 with WP04
    (spike deletion) and WP11 (resource-config) named as later editors and mirrored as recorded out-of-map
    edits in their frontmatter. Add a native-smoke red-first check to the first subtask of WP03 so missing
    metadata is caught in the WP that introduces the class.

    '
  refute_reason: META-INF/native-image/** and spike/** are owned only by WP01 in wps.yaml, WP04 T023 deletes
    spike files it does not own, and no later WP (WP03, WP04, WP11) owns reachability or resource metadata
    that native-smoke would need.
- id: TASKS-SEQ-003
  lens: seq
  severity: 3
  title: Several serial edits touch files owned by another WP and are absent from owned_files and lane
    write_scope
  evidence:
  - artifact: "tasks-overview.md \xA7 4 (chokepoint table lists Gradle build files, dist-set.json and\
      \ scripts/release/README.md as multi-WP) and \xA7 3 R2 (only 'marker comment removal' and 'ledger\
      \ rows' are declared out-of-map)"
  - artifact: "wps.yaml \xA7 WP08 owned_files (README.md yes, dist-set.json no) vs tasks/WP08-packaging-remainder.md\
      \ \xA7 T052 (extends dist-set.json)"
  - artifact: "tasks/WP02-java-domain-core.md \xA7 T016 (edits domain/build.gradle.kts, a WP01 file)"
  - artifact: tasks/WP11-events-release-consumer.md Context (edits adapter/build.gradle.kts and pyproject.toml
      floor)
  - artifact: "tasks/WP09-release-workflow.md \xA7 T061 or SBOM step (edits services/event-producer/build.gradle.kts\
      \ and gradle/verification-metadata.xml)"
  - artifact: "lanes.json \xA7 lane-h, lane-b, lane-k, lane-i write_scope (none lists those files)"
  - code: scripts/release/README.md:11 (no stale release.yml-absent line; the only stale 'release.yml
      is not present' text is AGENTS.md:379-381)
  claim: 'The chokepoint table says these files are edited serially by several WPs, but the machine-readable
    ownership (wps.yaml owned_files, and lanes.json write_scope derived from it) names a single owner,
    so each later edit is outside the editing WP''s scope and will be flagged by diff-scope review or
    blocked by a scope guard. Missing: WP08 -> scripts/release/dist-set.json; WP02/WP03/WP11/WP09 -> WP01''s
    *.gradle.kts and verification-metadata.xml; WP11 -> pyproject.toml; WP01 T002 -> scripts/release/README.md
    (owned by WP08). Also, the README edit appears unnecessary: only AGENTS.md carries the stale ''PyPI
    Release'' claim.

    '
  remediation: 'List an explicit ''recorded out-of-map edits'' block (file, WP, reason, ordering) in each
    editing WP''s frontmatter or body and extend tasks-overview.md R2 to cover them all, so reviewers
    have an allowlist. Drop the scripts/release/README.md edit from WP01 T002 (or confirm the stale line
    exists first). Where an edit is large (WP09 SBOM into the Java build), prefer moving the Gradle part
    into a Java-owned WP rather than a python-pedro/ivan WP.

    '
  refute_reason: WP08 T052 extends dist-set.json which is absent from WP08 owned_files (WP01 owns it),
    and the Gradle and pyproject edits by WP02, WP03, WP09 and WP11 are outside their owned_files while
    overview R2 declares only marker and ledger edits as out-of-map; the README-stale sub-claim is minor
    and unneeded.
- id: TASKS-SEQ-004
  lens: order
  severity: 3
  title: 'WP05->WP04 refinement: the registration point is unspecified, so the stated reason and the ownership
    do not match'
  evidence:
  - artifact: "tasks-overview.md \xA7 3 R1 and tasks/WP05-java-retention.md Context ('two WPs editing\
      \ the launcher entry concurrently')"
  - artifact: "tasks/WP04-java-produce-and-protocol.md \xA7 T026 ('retain is routed to a registration\
      \ point WP05 fills; until then retain replies refused')"
  - artifact: "tasks/WP05-java-retention.md \xA7 T033 ('registers the operation at WP04's registration\
      \ point')"
  - artifact: "wps.yaml \xA7 WP04 (owns launcher/*.java) and \xA7 WP05 (owns launcher/retain/** only)"
  claim: 'The dependency itself is right (WP05 needs WP04''s handler interface and port package at compile
    time), but the justification and the mechanism are inconsistent. WP05 owns only launcher/retain/**;
    if registration is an explicit table or call in a launcher/*.java class (WP04''s), WP05 must edit
    a WP04 file, which is not in its owned_files. If it is ServiceLoader, it needs a META-INF/services
    resource (unowned) and native-image service metadata (see TASKS-SEQ-002). Because WP05 would not touch
    WP04 files, the ''concurrent writes'' reason in R1 is not what forces the edge; the compile-time interface
    is. WP03 is also a redundant dependency of WP05 (transitive through WP04).

    '
  remediation: 'In WP04 T026 fix the mechanism: an interface OperationHandler plus a registry class where
    the handler list is assembled by a single method that WP05 does NOT edit (for example the launcher
    discovers handlers in launcher/retain via an explicit one-line addition that WP04 pre-wires as an
    import of a WP05-owned factory class with a stub), or add the one registration file to WP05 owned_files.
    Reword R1 to ''compile-time dependency on the handler interface''. Reduce WP05 dependencies to [WP04].

    '
  refute_reason: WP05 T033 registers at an unspecified WP04 registration point while WP05 owns only launcher/retain/**,
    so the mechanism and ownership disagree and R1's "concurrent writes" reasoning does not match the
    real compile-time dependency.
- id: TASKS-SEQ-005
  lens: order
  severity: 3
  title: Events-release gate semantics differ between WPs and over-gate WP09 and WP07
  evidence:
  - artifact: "tasks/WP11-events-release-consumer.md \xA7 T071 ('blocks approval, not authoring')"
  - artifact: "tasks/WP07-journal-stamping-lanes-markers-docs.md \xA7 T044 ('STOP; WP07 is not started')"
  - artifact: "tasks/WP09-release-workflow.md \xA7 T058 ('STOP; WP09 is not started or approved')"
  - artifact: "wps.yaml \xA7 WP07 dependencies [WP06, WP11]; \xA7 WP09 [WP08, WP11]; \xA7 WP10 [... WP11]"
  - artifact: "tasks-overview.md \xA7 2 (WP07, WP09, WP10, WP11 'each start with a precondition task')"
  claim: 'WP11 may be authored before the release, yet WP07, WP09 and WP10 declare ''not started'' until
    WP11 is complete, and WP11 cannot complete (be approved) before the release, so the entire tail (WP07,
    WP09, WP10) is idle until the external PR is released, even though most of their work reads no released
    artifact: WP09 edits release.yml, ci-nightly.yml and docs; WP07''s lane consolidation (T045), marker
    clearing and ADRs need none of the events schemas, and only AC-019 and the pin do. ''WP11 complete''
    is also ambiguous (approved, merged, or done). This sequences all non-gated work behind a foreign
    release and makes the critical path external. The gate itself is present in each gated WP, which is
    correct; the strength differs.

    '
  remediation: 'Use one definition in all four WPs: the precondition blocks APPROVAL and the schema-reading
    subtasks (T046 journal validation, AC-019, WP10 measurements), not authoring. Change WP09''s and WP07''s
    gate text accordingly, and in wps.yaml keep dependency WP11 only where code or build files are actually
    consumed (WP07: yes for the pyproject floor and installed schemas; WP09: keep WP08 only plus a gate
    on approval). Define ''complete'' as ''WP11 approved with the pin naming the released wheel'' in tasks-overview.md
    section 2.

    '
  refute_reason: WP11 T071 says the gate blocks approval not authoring while WP07 T044 and WP09 T058 say
    STOP and not started, and "complete" is undefined; the inconsistency is real though severity 3 is
    overstated (the dependency edges are a deliberate design).
- id: TASKS-SEQ-006
  lens: seq
  severity: 3
  title: WP01 verdict (T010) comes after CI registration and the other non-spike work
  evidence:
  - artifact: "tasks/WP01-feasibility-gate-and-build-skeleton.md \xA7 T001-T010 order (T006 hook, T007\
      \ workflow plus fleet-verdict registration precede T008-T010 measurements and verdict)"
  - artifact: 'tasks/WP01 ''Feasibility gate'' section (HALT: write research/wp01-feasibility.md, stop)'
  - artifact: "plan.md \xA7 11 (WP01 'risky first')"
  claim: 'The HALT criterion is real and measurable (four PASS conditions, two fallbacks, stop-and-report),
    which is good. But the decisive evidence is T008 (stub wheel on each OS) and T009/T010, which run
    after T007 has registered two workflows in the shared fleet-verdict gate and ledger. If a leg HALTs,
    WP01 has already changed a shared CI chokepoint (fleet_verdict.py, ci-fleet-verdict.yml, test_fleet_verdict.py)
    and added a pyproject hook table for a mission that may not proceed, and the HALT text tells the agent
    only to stop WP02, not to roll those back. Also the verdict depends on GitHub runners for macOS and
    Windows, which the WP does not say how to obtain before a push.

    '
  remediation: 'Reorder to T001 baseline, campsite, T003 skeleton, T004 spike, T005 producer-native.yml,
    then T008/T009/T010 spike measurements and an interim verdict; make T006 (hook) and T007 (fleet-verdict
    registration, event-producer.yml) follow a PASS. State in the HALT text what is left in the tree (spike
    and evidence only) and name the runner access assumption.

    '
  refute_reason: WP01 lists T006 hook and T007 fleet-verdict registration before T008-T010 measurements,
    and the HALT text only says stop and report without stating what is left in the tree.
