- id: SPEC-COMPLETE-001
  lens: Coverage / Testability
  severity: 4
  title: Clock uniqueness is stated per machine identity but the state file and publish log are per checkout
  evidence:
  - artifact: "spec.md \xA7 FR-011, FR-012, AC-010"
  - artifact: "data-model.md \xA7 1 (nodeid), \xA7 7 LamportState"
  - artifact: "plan-carryover.md \xA7 T (publish log is per resolved checkout, SK-331/SK-319)"
  - code: 'src/specify_cli/status/migrate_lifecycle_envelope.py::_generate_node_id (SHA-256 of hostname and username: one id per machine and user, not per checkout)'
  - artifact: "spec.md \xA7 FR-011, FR-012, AC-010; data-model.md \xA7 1 nodeid row, \xA7 7 LamportState"
  - code: src/specify_cli/status/migrate_lifecycle_envelope.py::_generate_node_id
  claim: FR-012 promises that no two events share a (nodeid, lamportclock) pair, but nodeid is one value for every checkout on a machine (primary checkout plus each lane worktree) while LamportState is
    a gitignored file inside a checkout and the publish log is per resolved checkout. Two worktrees of one machine therefore run independent counters under the same nodeid and mint the same pair for different
    events. AC-010 only exercises N processes on a single scratch repo, so it passes while the invariant is broken in the normal multi-lane setup. The state-file scope is a requirement here (it decides
    the invariant), not a plan detail.
  remediation: State the scope of the counter in FR-012 and LamportState (counter shared by every checkout of the same machine identity, for example anchored at the git common directory, or nodeid made
    unique per checkout). Extend AC-010 with a fixture of one primary checkout plus two worktrees, concurrent stamping, and the falsifier "same (nodeid, lamportclock) for two events".
  merged_from:
  - SPEC-ORDER-004
- id: SPEC-COMPLETE-002
  lens: Testability
  severity: 4
  title: Seam census gate (AC-004) has no discovery rule, floor or self-mutation test
  evidence:
  - artifact: "spec.md \xA7 FR-003, AC-004, \xA7 11 risk 'Seam coverage drift: guarded by the census gate (AC-004)'"
  - artifact: "spec.md \xA7 FR-027 / AC-012 and FR-031 / AC-014 (the same section gives those two gates a floor and a self-mutation test)"
  claim: The only guard against a later writer bypassing the seam is AC-004, which says "per in-scope writer, one forced row yields one seam call". It does not say how writers are enumerated (hand-written
    list versus discovery over src/), has no floor (an empty or truncated list passes vacuously) and no self-mutation test (add an in-scope writer that persists without a seam call and the gate must fail).
    FR-003 says "a census gate fails when an in-scope writer persists a row with no seam call", but a hand list cannot detect a writer it does not list, so the stated drift guard does not guard drift.
  remediation: 'Amend AC-004 to require (a) the writer set derived from the type table / source discovery, (b) a floor equal to the number of in-scope writers in data-model section 3, and (c) a self-mutation
    case: an injected writer with no seam call makes the gate fail.'
