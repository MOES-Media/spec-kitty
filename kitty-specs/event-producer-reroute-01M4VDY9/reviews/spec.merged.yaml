- id: SPEC-GOV-001
  lens: Governance-drift honesty
  severity: 3
  title: Section 9 flags only ADR D-1 as superseded; the publish log also departs from D-2 and D-3 of the same ADR
  evidence:
  - artifact: "spec.md \xA7 9 item 3; \xA7 3 D-SINK; \xA7 10 OD-SINK; data-model.md \xA7 7 PublishLogFile"
  - code: docs/adr/4.x/2026-10-13-2-the-event-ledger-is-the-publication-seam-default-on-with-local-retention.md::D-2, D-3
  claim: 'ADR D-2 says a subscriber learns of events "by reading the ledger, never by being called by the CLI" and names the supported read paths (events tail, the Read API); D-3 enumerates the closed list
    of local-tier files under retention. The spec adds a second persisted artifact (a publish log duplicating ledger content) as an integration read surface and a new local-tier file class, which the ADR
    does not list. Section 9 records only the D-1 flat-rows supersession (FR-045); the D-2 read-path statement and the D-3 file list are changed in effect but not flagged, and OD-SINK frames the choice
    as a sink question only. The ADR does allow local adapters on the seam, so this is a flag-and-amend gap, not a violation.

    '
  remediation: 'Add a section 9 item: the publish log, fault log and clock state extend D-2''s read-path set and D-3''s local-tier list; extend FR-045 so the ADR amendment covers D-2 (new supported read
    path) and D-3 (new local-tier files), not only D-1.

    '
