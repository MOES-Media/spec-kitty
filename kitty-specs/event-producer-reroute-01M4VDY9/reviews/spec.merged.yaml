  title: Retrospective lifecycle rows are persisted into the ledger but appear nowhere in the type table, the deferral list or the census
  evidence:
  - artifact: "spec.md \xA7 FR-003, FR-017 ('rows of types not in this table are never published and never an error'); data-model.md \xA7 3"
  - code: src/specify_cli/retrospective/lifecycle_events.py (RetrospectiveCaptured, RetrospectiveCaptureFailed, RetrospectiveSkipped appended to status.events.jsonl through append_raw_rows_atomic; a separate
      drain-gated live-work publish)
  - code: src/specify_cli/status/lifecycle_events.py::AUTHORITATIVE_NON_LANE_EVENT_TYPES (defines the ledger's non-lane row set)
  claim: The census gate (FR-003) is defined over "in-scope writers", and in-scope is whatever the table lists, so a ledger row kind that is authoritative and non-lane can be missing without any gate noticing.
    FR-017's catch-all makes the omission silent by design. Retrospective rows are exactly such a kind, written by a fourth writer outside status/lifecycle_events.py, and they are neither in scope nor on
