    '
- id: SPEC-GOV-004
  lens: Scope
  severity: 3
  title: '"One writer per event type" (C-004, decision 7) is asserted while D-SINK makes two writers per type'
  evidence:
  - artifact: "spec.md \xA7 3 D-SINK; \xA7 5 C-004; \xA7 7 rows #6193/#6195/#6196; \xA7 10 OD-SINK"
  - code: 'issue spec-kitty#6193 (''one writer per event type''); #6195/#6196 (''Python writers deleted in the same release'')'
  claim: 'Under D-SINK the Python ledger writers and the Java producer both write each in-scope type, to different files. C-004 and decision 7 are encoded as a constraint but never defined per sink, so
    the constraint is untestable and arguably contradicted. The epic''s migration rule (no event ever has two writers) is satisfied only if "writer" means "writer of a given file", and the cutover story
    (who stops writing the publish log duplicate when #6195/#6196 move the authoritative write to Java) is left implicit.

    '
  remediation: 'Define C-004 per artifact: one writer of the authoritative ledger row and one writer of the publish-log row per type, and state in section 7 that at cutover the Java core writes both and
    the publish log either becomes the ledger or is retired (decision left to #6193/#6195), so no type has two writers of the same file.

    '
