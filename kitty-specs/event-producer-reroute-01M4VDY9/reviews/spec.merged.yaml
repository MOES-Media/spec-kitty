- id: SPEC-COMPLETE-008
  lens: Silent-success / Testability
  severity: 3
  title: Timeout or crash after the append can make the NOT produced warning false, and the kill-mid-stamp state is untested
  evidence:
  - artifact: "spec.md \xA7 FR-012, FR-021, FR-023, FR-025, AC-006, AC-010"
  - artifact: "data-model.md \xA7 7 LamportState ('stamp and append are one exclusive operation')"
  claim: The client terminates the producer on timeout and records timeout with the sentence that the event was NOT produced. The producer may have completed the append (or die between the clock persist
    and the append). Then the log holds the row while the fault log says it does not, and a later re-fire is deduplicated (FR-016). The behaviour of the clock state when the process is killed between the
    counter update and the line append (duplicate or gap) is not specified, and AC-006 and AC-010 do not cover it. AC-026 covers a torn line but not a kill between the two halves of the exclusive operation.
  remediation: 'Require that a kill at any point leaves either no clock advance and no line, or a gap in the counter plus a complete line, never a reused clock value (state the permitted outcomes in FR-012).
    Word the timeout and crash warnings as "the event may not have been produced" or define that doctor reconciles the log against the ledger. Add an AC: kill the producer between stamp and append, then
    run again; no duplicate (nodeid, lamportclock) and a recorded fault.'
