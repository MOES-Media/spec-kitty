- id: SPEC-ORDER-009
  lens: compatibility and ordering correctness
  severity: 2
  title: Equal keys are said to be the same event, but the key omits source; and the survivor of a (source, id) duplicate with a different key is undefined
  evidence:
  - artifact: "data-model.md \xA7 4 ('Equal keys are the same event under the dedupe key and collapse'); \xA7 2 dedupe key (source, id), INTERIM"
  - code: src/specify_cli/status/event_log_merge.py (merge keyed on event_id; raises on conflicting payloads for the same id)
  claim: 'Equal order key means equal id, not equal (source, id): two events with the same id in different sources (a project-scoped and a Mission-scoped log) tie in the order yet are distinct. In the other
    direction two rows with the same (source, id) but different clock or time (a retry that re-stamped, a hand-copied line) are not equal keys, so ordering keeps both while dedupe says one. Which survives,
    and what happens when their content differs (the shipped merge driver fails loudly), is unstated. Order-independence of the result therefore depends on an unspecified rule.

    '
  remediation: 'One sentence in section 4: the order is applied after dedupe; of duplicate (source, id) rows the row with the smallest key is kept and any differing payload is reported as a conflict (named
    reason); rows of different sources are compared by the same key and tie only if identical in all four fields (then input order is irrelevant because they are byte-equal, or add source as a final key
    component).

    '
- id: SPEC-ORDER-010
  lens: compatibility and ordering correctness
  severity: 2
  title: Time parsing leaves naive times, fractional precision and the written UTC form unpinned
  evidence:
  - artifact: "data-model.md \xA7 2 time rule; \xA7 4 'time as a UTC instant'; spec.md FR-008, NFR-003"
  - code: 'kitty-specs/*/status.events.jsonl at-forms: microsecond +00:00 (about 41.6k rows), bare Z (376), no-fraction +00:00 (3)'
  - code: Python 3.11 datetime.fromisoformat truncates 7-9 fractional digits to microseconds, accepts a naive time, rejects second 60
  claim: 'RFC 3339 requires an offset, yet the standard Python parser accepts a naive time; readers will differ on whether `2026-10-13T10:00:00` is an instant (assumed UTC), an error row, or `rejected`
    for the producer. Fractional digits beyond 6 are silently truncated by a Python comparator but compared at nanosecond precision in Java, so two rows distinct to Java tie in Python and fall through to
    id. The written form (`Z` versus `+00:00`, trailing-zero fractions) is not fixed although NFR-003 requires byte-identical lines (existing ledgers already contain both spellings).

    '
  remediation: 'Add to section 4: an offset is required (a naive time is an unparseable-time error row); instants compare at nanosecond precision (a comparator that truncates is non-conformant); leap second
    60 is an error; and to section 2 or the plan fix one written form for `time` (for example UTC `Z`, microseconds only when non-zero). Add a naive-time and a 9-digit-fraction row to the AC-009 fixtures.

    '
- id: SPEC-ORDER-011
  lens: compatibility and ordering correctness
  severity: 3
  title: A Mission with no mission_id in meta.json is refused on every event, which conflicts with the aggregate-split rule and with FR-038 for Missions open at upgrade
  evidence:
  - artifact: "spec.md \xA7 FR-009 ('if neither yields it, the event is refused'), FR-023 (one warning per event), FR-038; data-model.md \xA7 2 source rule, \xA7 1 missionid row"
  - artifact: 'arch.md (aggregate split): a non-ULID mission segment falls under ''any other prefix'': source /spec-kitty/projects/<project_uuid>, subject = full aggregate_id, no missionid'
  - code: src/specify_cli/status/emit.py::_load_mission_id (returns None for legacy Missions pre-3.1.1)
  claim: 'The repository''s own Missions all carry a mission_id, but the code documents Missions without one. Under FR-009 every lifecycle and status event of such a Mission, open at upgrade, is a fault:
    a warning per event for the rest of its life, and no integration sees it. ADR 0001''s rule for a non-ULID mission segment is the opposite (project source, no missionid), and the spec does not say it
    deliberately diverges. "A mission open at upgrade keeps working" is true for the command but not for the publication this mission exists for.

    '
  remediation: 'Add one statement to FR-009: either (a) refused, with the warning raised once per Mission and a doctor line naming the repair (and confirm that the upgrade path backfills mission_id for
    open Missions), or (b) follow the ADR 0001 fallback (project source, subject = the aggregate, no missionid). Add the chosen case to AC-005''s `rejected` row or to a new AC.

    '
- id: SPEC-ORDER-012
  lens: compatibility and ordering correctness
  severity: 2
  title: The non-ULID event_id fallback in the lifecycle writer is dead in supported installs, so the producer's refusal path guards an unreachable writer defect instead of removing it
  evidence:
  - artifact: "spec.md \xA7 FR-007, AC-005 (`rejected` for non-ULID id); data-model.md \xA7 2 id rule, \xA7 8 exemption markers 5 and 6"
  - code: src/specify_cli/status/lifecycle_events.py::_generate_event_id (uuid4().hex fallback on any import error)
  - code: 'pyproject.toml dependencies: python-ulid>=3.0 (hard dependency)'
  claim: 'CloudEvents `id` equals the ledger event_id only if every writer emits a ULID. Status and decisions writers do (`_generate_ulid`); the run journal is covered by FR-035; the lifecycle writer keeps
    a 32-hex fallback that cannot fire when python-ulid is installed. Leaving it means a permanently unpublishable ledger row is still reachable by a broken environment, and the mission is already editing
    that function to clear markers 5 and 6.

    '
  remediation: 'Add to the lifecycle part of FR-032/FR-035: remove the uuid fallback so a ULID failure raises at write time (single authority, charter), keeping the producer''s `rejected` path only for
    rows written before the change.

    '
- id: SPEC-ORDER-013
  lens: compatibility and ordering correctness
  severity: 2
