schema: review-confirmed/v1
phase: spec
findings:
- id: SPEC-GOV-001
  lens: Governance-drift honesty
  severity: 3
  title: Section 9 flags only ADR D-1 as superseded; the publish log also departs from D-2 and D-3 of the same ADR
  evidence:
  - artifact: "spec.md \xA7 9 item 3; \xA7 3 D-SINK; \xA7 10 OD-SINK; data-model.md \xA7 7 PublishLogFile"
  - code: docs/adr/4.x/2026-10-13-2-the-event-ledger-is-the-publication-seam-default-on-with-local-retention.md::D-2, D-3
  claim: 'ADR D-2 says a subscriber learns of events "by reading the ledger, never by being called by the CLI" and names the supported read paths (events tail, the Read API); D-3 enumerates the closed list
    of local-tier files under retention. The spec adds a second persisted artifact (a publish log duplicating ledger content) as an integration read surface and a new local-tier file class, which the ADR
    does not list. Section 9 records only the D-1 flat-rows supersession (FR-045); the D-2 read-path statement and the D-3 file list are changed in effect but not flagged, and OD-SINK frames the choice
    as a sink question only. The ADR does allow local adapters on the seam, so this is a flag-and-amend gap, not a violation.

    '
  remediation: 'Add a section 9 item: the publish log, fault log and clock state extend D-2''s read-path set and D-3''s local-tier list; extend FR-045 so the ADR amendment covers D-2 (new supported read
    path) and D-3 (new local-tier files), not only D-1.

    '
  refute_reason: Section 9 item 3 and FR-045 cover only ADR D-1, while the publish, fault and clock-state files extend the closed local-tier file list in D-3 (checked in the ADR) and add a new log that
    integrations read.
- id: SPEC-GOV-002
  lens: Scope
  severity: 3
  title: FR-014 says the events PR "adds nothing else" yet FR-013, FR-034/data-model section 9 and FR-035 add more to it
  evidence:
  - artifact: "spec.md \xA7 4 FR-013, FR-014, FR-034, FR-035; \xA7 1 in-scope item 3; data-model.md \xA7 9 (spec_kitty_events.Lane aligned in the events PR)"
  claim: 'FR-014 closes the events PR to schemas, registry entries, dataschema URIs and producer fixtures and says the envelope schema, validator and upcaster are events#92''s. FR-013 adds a reference comparator
    specification and total-order fixtures to the same PR, data-model section 9 adds a change to the events package''s Lane enumeration, and FR-035 conditionally adds a minimal envelope subset. The allocation
    against events#92 (whose body lists envelope, registry, schemas, upcaster, compatibility entries, and no ordering comparator or Lane change) is therefore internally inconsistent, which invites parallel-set
    drift the operator forbade.

    '
  remediation: 'Restate FR-014 as the closed list of what the events PR carries (data schemas, registry entries, dataschema URIs, producer fixtures, total-order comparator spec and fixtures, Lane alignment,
    conditional envelope subset) and add the comparator and Lane change to the section 7 hand-off row for events#92 so #92 can acknowledge them.

    '
  refute_reason: FR-014 says the events PR adds nothing else, yet FR-013 puts the comparator spec and fixtures in it and data-model section 9 puts the Lane alignment in it, a verified internal contradiction.
- id: SPEC-GOV-004
  lens: Scope
  severity: 3
  title: '"One writer per event type" (C-004, decision 7) is asserted while D-SINK makes two writers per type'
  evidence:
  - artifact: "spec.md \xA7 3 D-SINK; \xA7 5 C-004; \xA7 7 rows #6193/#6195/#6196; \xA7 10 OD-SINK"
  - code: 'issue spec-kitty#6193 (''one writer per event type''); #6195/#6196 (''Python writers deleted in the same release'')'
  claim: 'Under D-SINK the Python ledger writers and the Java producer both write each in-scope type, to different files. C-004 and decision 7 are encoded as a constraint but never defined per sink, so
    the constraint is untestable and arguably contradicted. The epic''s migration rule (no event ever has two writers) is satisfied only if "writer" means "writer of a given file", and the cutover story
    (who stops writing the publish log duplicate when #6195/#6196 move the authoritative write to Java) is left implicit.

    '
  remediation: 'Define C-004 per artifact: one writer of the authoritative ledger row and one writer of the publish-log row per type, and state in section 7 that at cutover the Java core writes both and
    the publish log either becomes the ledger or is retired (decision left to #6193/#6195), so no type has two writers of the same file.

    '
  refute_reason: C-004 and decision 7 say one writer per type while D-SINK gives Python ledger writers and the Java producer each a write per type, and C-004 never defines writer per artifact.
- id: SPEC-GOV-005
  lens: Directive
  severity: 3
  title: How the Java producer obtains the events-repo data schemas is not decided, and sits across the no-vendoring rule
  evidence:
  - artifact: "spec.md \xA7 4 FR-015, FR-039, FR-040; \xA7 9 item 2; \xA7 10 (no matching OD)"
  - code: '.kittify/charter/charter.md::Architecture: Shared Package Boundaries / External Contract Packages (''Do not vendor their source'')'
  claim: 'FR-015 makes the Java producer validate every row against the events-repo data schemas, and FR-040 forbids path/git overrides. Section 9 item 2 notes binding generation crosses the no-vendoring
    line but no open decision names the delivery mechanism (build-time fetch of the released artifact, copy, or generated binding), although the choice is plan-blocking for the Gradle build and is gated
    in events#92 on a charter amendment not owned here. A plan could pick vendoring unnoticed.

    '
  remediation: 'Add OD-SCHEMA-DELIVERY to section 10 (options: consume the released events artifact at build time; wait for #92''s Java binding; copy), recommend the first, mark it plan-blocking, and require
    in FR-039 that no schema source is committed to this repository.

    '
  refute_reason: FR-015 requires the Java producer to validate against events-repo schemas and section 9 item 2 flags the no-vendoring boundary, but no open decision or FR states how the schemas reach the
    Java build.
- id: SPEC-ARCH-001
  lens: Layering (seam as it really behaves)
  severity: 4
  title: ProduceRequest.repo_root is not what the seam carries; the kwarg is a canonicalisation starting point, and an unresolvable one fails closed silently
  evidence:
  - artifact: "data-model.md \xA7 6 ProduceRequest (repo_root: 'the emitting checkout as the seam carries it'); spec.md \xA7 FR-004 ('together with the mission directory or repo root the call already carries')"
  - code: src/specify_cli/status/lifecycle_events.py::fanout_lifecycle_event_hosted (repo_root = log_path.parent)
  - code: src/specify_cli/events/runtime_moments.py::RuntimeMomentProducer._repo_root (returns self._feature_dir, passed as repo_root)
  - code: src/specify_cli/core/hosted_posture.py::_resolve_repo_root (documents the value as a starting point, walks up via resolve_canonical_root, returns None on failure)
  claim: The three fire_* functions take a repo_root keyword, but its value is not a repository root on the lifecycle and run-moment paths. fanout_lifecycle_event_hosted passes the directory that holds
    the log (a Mission directory, or the project state directory for the project-scoped log), and RuntimeMomentProducer passes the feature directory. hosted_posture._resolve_repo_root exists precisely because
    callers hand it a subdirectory, and it returns None (treated as "drain off") when it cannot resolve. A producer that takes data-model section 6 at face value would place the publish log, the clock state
    and the fault log relative to a Mission directory, or under a lane worktree, and an unresolvable start would degrade into the old silent return rather than a recorded fault. Nothing in the spec says
    which component resolves the canonical root, and AC-004 checks only that a call is made.
  remediation: 'Reword ProduceRequest.repo_root and FR-004: the seam supplies a starting path (log path, Mission directory or repo root, as each call site gives it) and the PRODUCER resolves the canonical
    repository root from it (the same canonical-root resolution the lock and posture code use, so a lane worktree, a coordination worktree and the primary checkout all reach one publish log). An unresolvable
    start is fault class rejected (or a new named class), never a silent return. Add to AC-001/AC-004 one case per slot fired from a lane worktree and from a Mission subdirectory, asserting the same single
    publish log.'
  refute_reason: Code shows the seam passes log_path.parent or the feature directory as repo_root while data-model section 6 calls it the emitting checkout, and no artifact says the producer canonicalises
    it or what an unresolvable start produces.
- id: SPEC-ARCH-003
  lens: Layering (registration, drain gating, ADR D-2 encoding)
  severity: 4
  title: 'FR-002 omits two of the places that silence the seam: RuntimeMomentProducer''s own drain check and the moment-handler registration kill switch'
  evidence:
  - artifact: "spec.md \xA7 FR-001, FR-002, AC-003, OD-OPTOUT; \xA7 2 E2"
  - code: src/specify_cli/events/runtime_moments.py::RuntimeMomentProducer._publish (reads hosted_posture.drain_posture before any fan-out)
  - code: 'src/specify_cli/status/adapters.py import tail: ''if moment_handlers_disabled_reason() is None: ensure_zeitgeist_moment_handlers()'''
  - code: src/specify_cli/core/env.py::moment_handlers_disabled_reason (SPEC_KITTY_NO_MOMENT_HANDLERS, SPEC_KITTY_SYNC_DISABLE, deprecated alias)
  - code: src/specify_cli/status/adapters.py::reset_handlers and ensure_zeitgeist_moment_handlers (test restore path only re-registers the Zeitgeist handlers)
  - artifact: docs/adr/4.x/2026-10-13-2-... D-2 (the runtime moment producer drops its own drain check; the registration gate keeps binding only the hosted handlers) and Confirmation (a pin that every ensure_zeitgeist_moment_handlers
      handler checks drain first)
  claim: FR-002 speaks only of the three fire_* functions. Run-journal rows reach the seam through RuntimeMomentProducer._publish, which has a fourth, separate drain read; left alone, no run-journal row
    is ever produced on a default install and FR-001 fails for that kind, while AC-003 (which tests the fire_* functions) stays green. Separately, if the client registers in the same import-tail branch
    as the Zeitgeist handlers, then setting a hosted kill switch silently removes the local producer, which is a not-produced event with no warning (FR-022/FR-023) and the very coupling the ADR removes.
    The ADR also names a confirmation test the spec does not carry, and the status test fixtures restore only the Zeitgeist wiring, so seam tests would run without the producer unless the restore path is
    extended.
  remediation: 'Extend FR-002 and AC-003: (a) RuntimeMomentProducer._publish drops its drain read and always calls the seam; (b) the client registers outside the moment_handlers_disabled_reason branch and
    is independent of those variables (state the `disabled` class is then reachable only by an explicit producer setting, or remove it, tying OD-OPTOUT to this); (c) the pin test that every Zeitgeist handler
    checks drain first moves with the gate; (d) the test reset/restore helpers re-register the client. Add a run-journal case and a kill-switch-set case to AC-003.'
  refute_reason: RuntimeMomentProducer._publish reads drain_posture itself and the adapters import tail registers behind moment_handlers_disabled_reason, neither of which FR-002, AC-003 or OD-OPTOUT addresses,
    so run-journal rows would never be produced on a default install.
- id: SPEC-ARCH-004
  lens: Layering (handler bounds, "never silent")
  severity: 3
  title: Seam-level drops (busy skip, handler TimeoutError, inline mode, per-event multiplication) bypass the fault record the spec promises
  evidence:
  - artifact: "spec.md \xA7 FR-022, FR-023, FR-025, AC-005, AC-006"
  - code: src/specify_cli/status/adapters.py::_run_fanout_handler_bounded (raises _FanoutHandlerBusyError when the handler key is still in flight; TimeoutError after the bound; timeout <= 0 runs inline
      with no bound)
  - code: src/specify_cli/status/adapters.py::fire_saas_fanout and fire_lifecycle_saas_fanout (these outcomes are only logger.warning / logger.debug lines)
  - code: src/specify_cli/status/emit.py::emit_status_transition_batch (one _saas_fan_out per event in the batch)
  claim: 'The bound lives in the seam, per handler call, not in the client. Three seam outcomes produce no row and no FR-023 warning: a skipped call because a prior invocation of the same handler is still
    running, a seam-side TimeoutError (the client records `timeout` only if it fires first), and an exception raised before the client''s own try. The fault enum has no class for the busy skip. SPEC_KITTY_SAAS_FANOUT_TIMEOUT
    <= 0 removes the bound entirely, so FR-025''s "never holds the command beyond the fan-out bound" has no meaning in that mode. A batch of N events pays up to N times the client timeout, which AC-006
    (one stub) does not bound.'
  remediation: 'State in FR-023/FR-025 that the client is the outermost catch (a handler that never raises), that its timeout is strictly below the seam bound, and that a busy-skip is recorded as a not-produced
    fault (add a class, or map it explicitly). Say what FR-025 means when the seam bound is disabled (the client timeout still applies) and add a per-command budget (for example one breaker per process:
    after the first timeout the rest of the batch records one fault each without spawning). Add a busy-skip and a batch case to AC-005/AC-006.'
  refute_reason: adapters.py really drops a busy-skipped handler and a seam-side TimeoutError with only a logger.warning, and runs inline unbounded at timeout <= 0, so FR-023's never-silent promise has
    uncovered outcomes the fault enum does not name.
- id: SPEC-ARCH-005
  lens: Layering (slots and coverage)
  severity: 3
  title: The resolved-binding slot is not a row source; ProduceRequest.slot and FR-003 invite a second call for the same annotation row
  evidence:
  - artifact: "data-model.md \xA7 6 ProduceRequest.slot (status | lifecycle | resolved_binding); \xA7 3 row 'Inner-state annotation'; spec.md \xA7 FR-003, FR-016"
  - code: src/specify_cli/status/emit.py::_resolved_binding_fan_out (fires only for an annotation whose delta binds role/profile/model/provider; passes causation_id, not a row)
  - code: src/specify_cli/status/emit.py::emit_status_transition (annotation fan-out follows the lane fan-out for the same prepared transition)
  claim: A WPResolvedBindingChanged call is a hosted projection of an InnerStateChanged annotation that is itself a persisted row (and of data already inside the lane row's actor binding). If the client
    is registered on all three slots, the same annotation reaches it twice, once with the annotation row and once as a kwargs-only call with no row; FR-003 "exactly once per persisted row" and FR-016 dedupe
    hide the problem instead of specifying it. Meanwhile the type table has no type for the slot, so the enum value is dead or ambiguous.
  remediation: State which slots the client registers on (status and lifecycle only, with the annotation getting its own seam call per FR-003) and drop `resolved_binding` from the ProduceRequest.slot enum,
    or define what a resolved-binding call produces. Add an AC-004 assertion that one annotation row yields one client invocation.
  refute_reason: ProduceRequest.slot lists resolved_binding with no type in the type table while the annotation row also gets its own seam call under FR-003, and nothing states which slots the client registers
    on, so a double call for one annotation is possible.
- id: SPEC-ARCH-006
  lens: Contracts (one schema set, FR-032 clearance of markers)
  severity: 4
  title: Marker clearance rests on an undefined 'legacy-row form' schema and AC-019 never validates the legacy writers' persisted lines
  evidence:
  - artifact: "spec.md \xA7 FR-032, AC-019, AC-002; data-model.md \xA7 8 ('clear' = writer's persisted line validated by the published per-kind schema (legacy-row form)) and \xA7 3 (event_id, at, actor,\
      \ wp_id lifted out of data)"
  - artifact: docs/adr/4.x/2026-10-13-2-... Confirmation (every persisted line validates against its row schema in a producer gate); operator decision 7 (one schema set)
  - code: src/specify_cli/status/lifecycle_events.py::_build_envelope and src/runtime/next/_internal_runtime/engine.py::_append_event (the writers whose markers are to be cleared; their persisted shape
      is the flat row)
  claim: The `data` schema excludes the members the type table lifts to attributes, but the legacy persisted rows (the committed ledgers the Python writers keep writing) hold those members inline. Validating
    such a row needs a second shape, called "legacy-row form", which is neither defined in data-model nor assigned to the events PR (FR-014 adds "nothing else"). If it is a second schema per type, it is
    the parallel set decisions 7 and C-004 forbid; if it is derived from the `data` schema plus the lifted-attribute set, that derivation must be stated. Independently, FR-032's gate and AC-019 validate
    PUBLISH-LOG lines, which are the producer's output, not the Python writers' persisted lines, so markers 1, 2, 5, 6 and 8 can be cleared with a green gate that never looked at the lines the markers exempt.
    That makes the clearance vacuous.
  remediation: In data-model section 8 define the legacy-row form as generated from the single `data` schema plus the lifted attribute list (one source, in the events PR, FR-014), or drop the clause and
    clear markers only on the producer-side evidence the producer can give. Rewrite AC-019 so the gate also validates the lines each cleared marker's writer persists (a fixture row per cleared marker, written
    by the real writer) and fails when one of them is made schema-invalid.
  refute_reason: The legacy-row form is used as the clearance criterion in FR-032 and data-model section 8 but is defined nowhere, and AC-019 validates only publish-log lines rather than the lines the cleared
    markers' writers persist.
- id: SPEC-ARCH-011
  lens: Canonical source
  severity: 3
  title: Node identity cites a non-canonical duplicate, and the cross-language owner of the value is undefined
  evidence:
  - artifact: "data-model.md \xA7 1 nodeid row ('_generate_node_id form'); spec.md \xA7 FR-011, E10"
  - code: 'src/specify_cli/identity/project.py::generate_node_id (canonical: sha256(hostname:username)[:12] via socket.gethostname and getpass.getuser)'
  - code: src/specify_cli/status/migrate_lifecycle_envelope.py::_generate_node_id (local copy kept for CORE import rules)
  claim: 'The data model points at the private copy in the migration module instead of the canonical function. More importantly the Java producer cannot call either: FR-026 forbids the client from computing
    or supplying the value, so Java must re-derive hostname and username on three operating systems and match what Python derives (Java and Python disagree on hostname resolution on macOS and Windows in
    practice). A mismatched nodeid fragments one machine''s clock domain across Python-produced and Java-produced rows.'
  remediation: Cite identity/project.py::generate_node_id as the canonical definition, and add to FR-011 that the node id is derived by the producer from the same inputs and the same hash with a golden
    test per OS against fixtures produced by the Python function; or have the request carry the value (and relax FR-026 for that one pass-through field, stated explicitly).
  refute_reason: data-model section 1 cites the private migration copy while the canonical function is identity/project.py::generate_node_id, and FR-026 forbids the client from supplying the value so the
    Java producer's derivation (hostname and username per OS) has no stated owner or test.
- id: SPEC-ARCH-013
  lens: Contracts (type table coverage)
  severity: 3
  title: Retrospective lifecycle rows are persisted into the ledger but appear nowhere in the type table, the deferral list or the census
  evidence:
  - artifact: "spec.md \xA7 FR-003, FR-017 ('rows of types not in this table are never published and never an error'); data-model.md \xA7 3"
  - code: src/specify_cli/retrospective/lifecycle_events.py (RetrospectiveCaptured, RetrospectiveCaptureFailed, RetrospectiveSkipped appended to status.events.jsonl through append_raw_rows_atomic; a separate
      drain-gated live-work publish)
  - code: src/specify_cli/status/lifecycle_events.py::AUTHORITATIVE_NON_LANE_EVENT_TYPES (defines the ledger's non-lane row set)
  claim: The census gate (FR-003) is defined over "in-scope writers", and in-scope is whatever the table lists, so a ledger row kind that is authoritative and non-lane can be missing without any gate noticing.
    FR-017's catch-all makes the omission silent by design. Retrospective rows are exactly such a kind, written by a fourth writer outside status/lifecycle_events.py, and they are neither in scope nor on
    the deferred list.
  remediation: Add the three retrospective rows to the type table as in scope (seam NEW) or deferred with a named residual, and make the census gate derive its universe from the ledger's non-lane row set
    (AUTHORITATIVE_NON_LANE_EVENT_TYPES plus the retrospective and lane kinds) so an unlisted persisted kind fails the gate instead of being ignored.
  refute_reason: retrospective/lifecycle_events.py appends RetrospectiveCaptured, CaptureFailed and Skipped to status.events.jsonl and fans them out, yet the words retrospective appear nowhere in spec.md,
    data-model.md or the deferral list, and FR-017 silently drops unlisted types.
- id: SPEC-COMPLETE-001
  lens: Coverage / Testability
  severity: 4
  title: Clock uniqueness is stated per machine identity but the state file and publish log are per checkout
  evidence:
  - artifact: "spec.md \xA7 FR-011, FR-012, AC-010"
  - artifact: "data-model.md \xA7 1 (nodeid), \xA7 7 LamportState"
  - artifact: "plan-carryover.md \xA7 T (publish log is per resolved checkout, SK-331/SK-319)"
  - code: 'src/specify_cli/status/migrate_lifecycle_envelope.py::_generate_node_id (SHA-256 of hostname and username: one id per machine and user, not per checkout)'
  - artifact: "spec.md \xA7 FR-011, FR-012, AC-010; data-model.md \xA7 1 nodeid row, \xA7 7 LamportState"
  - code: src/specify_cli/status/migrate_lifecycle_envelope.py::_generate_node_id
  claim: FR-012 promises that no two events share a (nodeid, lamportclock) pair, but nodeid is one value for every checkout on a machine (primary checkout plus each lane worktree) while LamportState is
    a gitignored file inside a checkout and the publish log is per resolved checkout. Two worktrees of one machine therefore run independent counters under the same nodeid and mint the same pair for different
    events. AC-010 only exercises N processes on a single scratch repo, so it passes while the invariant is broken in the normal multi-lane setup. The state-file scope is a requirement here (it decides
    the invariant), not a plan detail.
  remediation: State the scope of the counter in FR-012 and LamportState (counter shared by every checkout of the same machine identity, for example anchored at the git common directory, or nodeid made
    unique per checkout). Extend AC-010 with a fixture of one primary checkout plus two worktrees, concurrent stamping, and the falsifier "same (nodeid, lamportclock) for two events".
  merged_from:
  - SPEC-ORDER-004
  refute_reason: nodeid derives from hostname and username (one per machine and user) while the clock state file and publish log are per checkout, so FR-012's no-duplicate-pair guarantee is undefined across
    a primary checkout plus lane worktrees and AC-010 only tests one scratch repo.
- id: SPEC-COMPLETE-002
  lens: Testability
  severity: 4
  title: Seam census gate (AC-004) has no discovery rule, floor or self-mutation test
  evidence:
  - artifact: "spec.md \xA7 FR-003, AC-004, \xA7 11 risk 'Seam coverage drift: guarded by the census gate (AC-004)'"
  - artifact: "spec.md \xA7 FR-027 / AC-012 and FR-031 / AC-014 (the same section gives those two gates a floor and a self-mutation test)"
  claim: The only guard against a later writer bypassing the seam is AC-004, which says "per in-scope writer, one forced row yields one seam call". It does not say how writers are enumerated (hand-written
    list versus discovery over src/), has no floor (an empty or truncated list passes vacuously) and no self-mutation test (add an in-scope writer that persists without a seam call and the gate must fail).
    FR-003 says "a census gate fails when an in-scope writer persists a row with no seam call", but a hand list cannot detect a writer it does not list, so the stated drift guard does not guard drift.
  remediation: 'Amend AC-004 to require (a) the writer set derived from the type table / source discovery, (b) a floor equal to the number of in-scope writers in data-model section 3, and (c) a self-mutation
    case: an injected writer with no seam call makes the gate fail.'
  refute_reason: AC-004 says only per in-scope writer one forced row yields one seam call, with no discovery rule, floor or self-mutation case, unlike AC-012 and AC-014 which carry them.
- id: SPEC-COMPLETE-003
  lens: Testability / Internal consistency
  severity: 3
  title: AC-005 demands a test for fault class disabled while OD-OPTOUT recommends the class never occurs
  evidence:
  - artifact: "spec.md \xA7 AC-005 ('one test per class ... disabled')"
  - artifact: "spec.md \xA7 OD-OPTOUT (recommendation (a): the class stays in the enum, unused)"
  - artifact: "data-model.md \xA7 6 ProducerFault.class"
  claim: AC-005 lists disabled in its per-class fault matrix, but under the recommended resolution of OD-OPTOUT no code path can raise it, so the required test either cannot be written or is a vacuous test
    that forces an artificial path. FR-022 and FR-023 also carry the class in the contract.
  remediation: In AC-005 make the disabled row conditional on OD-OPTOUT (b), and under (a) require only the enum-equality gate stated in OD-OPTOUT; or drop the class from FR-022, FR-023 and ProducerFault
    until a kill switch exists.
  refute_reason: AC-005 requires a test per class including disabled while OD-OPTOUT recommends (a) under which the class never occurs, so the required test is unwritable or vacuous.
- id: SPEC-COMPLETE-004
  lens: Testability / Internal consistency
  severity: 3
  title: AC-013 contradicts the both-limits eligibility rule and no AC covers invalid retention configuration
  evidence:
  - artifact: "spec.md \xA7 AC-013 ('exactly keep_runs newest are kept' and 'an item younger than max_age_days is kept; both limits must be exceeded')"
  - artifact: "spec.md \xA7 FR-029"
  - artifact: "data-model.md \xA7 7 RetentionPolicy ('Invalid or non-numeric values are a named command error (fail closed)')"
  claim: If both limits must be exceeded for eligibility, items younger than max_age_days beyond the newest keep_runs are also kept, so "exactly keep_runs newest are kept" is false for such a fixture (the
    number kept is at least keep_runs). An implementation satisfying FR-029 would fail the AC as written, or the AC would be satisfied by an implementation that deletes young items. Separately, the fail-closed
    handling of invalid keys has no AC, and "open Mission" and "no unfinished step" are used without a definition.
  remediation: 'Reword AC-013 to "at least the newest keep_runs are kept, and any item within max_age_days is kept". Add an AC row: invalid or non-numeric keep_runs / max_age_days yields a named error and
    deletes nothing (also on a dry run). Define "open Mission" in FR-029 (for example any work package outside done and canceled).'
  refute_reason: AC-013 requires "exactly keep_runs newest are kept" while also keeping items younger than max_age_days and requiring both limits exceeded (FR-029), which contradict on a fixture, and no
    AC covers invalid retention values.
- id: SPEC-COMPLETE-005
  lens: Internal consistency
  severity: 3
  title: FR-007 both normalizes a UUID id and refuses a UUID-form (32-hex) id
  evidence:
  - artifact: "spec.md \xA7 FR-007 ('UUID lower-case hyphenated' ... 'stripped-env fallback ... is 32-hex UUID ... refused')"
  - artifact: "data-model.md \xA7 2 id ('ULID, 26 characters ... for every new event' and 'A non-ULID ledger id (the 32-hex fallback) is refused')"
