  - id: TASKS-DECOMP-009
    lens: Descriptions concrete enough to implement
    severity: 3
    title: WP10 end-to-end tests need a real native binary but give no skip or fail policy; red-first is impossible locally
    evidence:
      - artifact: "tasks/WP10 T065, T067, T068 ('Per-OS legs run only in CI'); Gates"
      - artifact: "tasks/WP01 T006: hatchling absent from the checkout venv"
    claim: >
      T065 requires a platform wheel built via the hook with the real GraalVM binary; the contributor machine has none, so the tests
      will either skip silently (vacuous green; the mission's own reflexivity rule says a skipped gate is not a gate) or be unrunnable
      for the red-first commit rule the same prompt demands.
    remediation: >
      State: tests use the JVM-launched producer via a documented env hook for local runs, and a module-level guard that FAILS (not
      skips) when CI is set and no binary is present; record which assertions run only in the native CI leg. Add the floor
      'at least one row appended' to each test.
  - id: TASKS-DECOMP-010
    lens: No padding or vacuous tasks
    severity: 2
    title: Possible duplicate smoke scripts across WP01 and WP09
    evidence:
      - artifact: "tasks/WP01 T007 ('a smoke script per OS') and T008; tasks/WP09 T060 (scripts/release/producer_smoke.py)"
    claim: >
      WP01 builds native-smoke with its own per-OS smoke script (owned only via tools/** or an unnamed path); WP09 creates
      producer_smoke.py doing the same thing for the release. Two scripts doing install-wheel-by-path-and-append-one-row will drift.
    remediation: >
      WP01 T007 creates scripts/release/producer_smoke.py (add to WP01 owned_files) and WP09 T060 only wires it into smoke-wheels.
  - id: TASKS-DECOMP-011
    lens: One PR must still leave a readable diff
    severity: 3
    title: Single-PR readability rests on generated metadata exclusion and WP ordering that no artifact enforces
    evidence:
      - artifact: "tasks-overview.md section 1: estimate 6 to 9 thousand Java lines, 2 to 3 thousand Python, 1.5 thousand workflows/docs, 'reviewable by WP' not as a raw diff"
      - artifact: "wps.yaml WP01 owned services/event-producer/gradle/verification-metadata.xml"
    claim: >
      The overview honestly says the raw diff is not readable in a sitting and relies on 'eleven contiguous WP ranges' and compact
      history. Nothing in any WP prompt requires that each WP's commits stay contiguous and individually green on the PR, and the
      later 'compact history' step can erase the WP boundaries. The reviewer cannot be told where WP ranges begin.
    remediation: >
      Add to the plan wrap-up step and README of this mission: the history compaction preserves one commit group per WP titled
      'WPnn: ...', and the PR body carries a table of WP, commit range, line count and reading order; mark verification-metadata.xml
      as linguist-generated in .gitattributes (WP01 owned file list would need .gitattributes). Re-evaluate the two-slice option in
      overview section 1 once WP06 is split.
  - id: TASKS-DECOMP-012
    lens: WP single-concern and reviewable in one sitting
    severity: 2
    title: WP04 and WP09 each carry a second-order edit in another WP's file with no marker in the prompt
    evidence:
      - artifact: "tasks/WP04 T023: first commit deletes WP01's launcher/.../spike/** (owned by WP01)"
      - artifact: "tasks/WP09 T061: additive edit of build.gradle.kts and verification-metadata.xml (SBOM plugin), contradicting WP01 T003 'later WPs add no dependencies'"
    claim: >
      T061 adds a Gradle plugin, which is a dependency requiring new verification-metadata entries and dependency checksum review,
      contradicting WP01's claim that the dependency set is settled in WP01. Reviewers of WP01 and WP09 receive conflicting rules.
    remediation: >
      Move the SBOM plugin into WP01 T003's settled dependency set, or reword WP01/WP03/WP11 to 'no runtime dependencies beyond the settled
      set; build plugins may be added by WP09 with checksums'. Note the spike deletion under WP04's ownership notes.
