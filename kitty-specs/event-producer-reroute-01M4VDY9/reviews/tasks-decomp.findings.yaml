  - id: TASKS-DECOMP-001
    lens: WP single-concern and reviewable in one sitting
    severity: 4
    title: WP06 is four concerns and 31 owned files; the split is left as an operator option instead of being made
    evidence:
      - artifact: "tasks/WP06-python-client-and-seam.md Context 'Size note' and Commit order; wps.yaml WP06 owned_files (31 entries)"
      - artifact: "tasks-overview.md section 1 ('WP06 is the largest single WP') and section 3"
      - code: "src/specify_cli/status/adapters.py, src/specify_cli/status/emit.py, src/runtime/next/_internal_runtime/engine.py, src/specify_cli/events/runtime_moments.py (all rewired by T036 to T038)"
    claim: >
      WP06 bundles (1) two new modules plus the fault log (T034, T035), (2) rewiring of about 16 existing production files
      at named symbols including the adapters.py drain-gate hunks A to D and a behaviour-preserving campsite fold (T036, T037),
      (3) a runtime-journal emitter route across the RuntimeEventEmitter Protocol, NullEmitter, DecisionGitLog and engine.py (T038),
      and (4) five architectural gates, a doctor command, a completion-manifest regeneration and three StateSurface entries
      (T039 to T042). The prompt itself concedes a reviewer may not hold it in a sitting and names the cut after commit-order step 4,
      but leaves the split undecided, so the dispatched unit is the unreadable one. Concerns (2)/(3) are high-risk edits to shared
      state-machine code, (1)/(4) are new additive code and gates; a reviewer cannot give both the same attention.
    remediation: >
      Split now, keeping numbering stable by renumbering the tail: WP06a "Thin client, fault log, doctor, state contract, thinness
      gate rules a/d/e" (T034, T035, T039 partial, T041, T042; new files only plus state/contract.py and status/__init__.py) and
      WP06b "Seam wiring, journal route, census" (T036, T037, T038, T040 plus gate rule c and T043), WP06b depending on WP06a.
      Both stay after WP04/WP05; WP07 depends on WP06b. This also gives the reviewer the mutation-tested gate before the call sites it polices.
  - id: TASKS-DECOMP-002
    lens: WP single-concern and reviewable in one sitting
    severity: 3
    title: WP07 mixes four unrelated concerns and gates the ungated ones behind the external events release
    evidence:
      - artifact: "tasks/WP07-journal-stamping-lanes-markers-docs.md title and T045, T046, T047, T049, T050"
      - artifact: "wps.yaml WP07 dependencies [WP06, WP11]; tasks-overview.md section 2 (WP07 gated)"
      - code: "src/specify_cli/migration/rebuild_state.py:144 (_VALID_LANES), src/specify_cli/acceptance/__init__.py:151, src/specify_cli/consolidation/done_bookkeeping.py:36"
    claim: >
      WP07 holds (a) lane-list consolidation (FR-034), which touches three production modules and reads no schema, (b) run-journal
      stamping plus thinness gate rule (b) (FR-035), (c) marker clearing and persisted-line lint mode that validates against released
      schemas (FR-032/033), and (d) glossary, Contextive and ADR edits (FR-045/046). Only (c) needs the released events wheel (T047
      validates against the installed package). Because the whole WP depends on WP11 and its first task blocks it, (a), (b) and (d)
      cannot even be started, reviewed or approved until a foreign repo releases. The WP title is a list of four nouns, the tell of
      more than one concern.
    remediation: >
      Split into WP07a "Lane-list consolidation and run-journal stamping with gate (b)" (T045, T046, depends WP06, ungated) and
      WP07b "Marker clearing, glossary, ADRs" (T047, T049, T050; depends WP07a and WP11, gated; T044 precondition lives here).
      Alternatively move glossary and ADRs (T049, T050) into the ungated WP07a. Update the chokepoint table accordingly.
  - id: TASKS-DECOMP-003
    lens: WP single-concern and reviewable in one sitting
    severity: 3
    title: WP01 combines an abandonable feasibility spike with permanent CI, release and pin machinery
    evidence:
      - artifact: "tasks/WP01-feasibility-gate-and-build-skeleton.md T001 to T010 and 'Feasibility gate' HALT rule"
      - artifact: "wps.yaml WP01 owned_files (27 entries across Gradle, three workflows, fleet_verdict, hatch hook, dist-set, gradle_pin_check, AGENTS.md)"
    claim: >
      The prompt says WP01 may HALT the mission after a failed leg, in which case WP02 onward never starts. Yet the same WP also
      lands permanent infrastructure that is only worth reviewing after PASS: fleet-verdict registration and a new required PR
      workflow (T007), the hatch build hook with its wheel tests (T006), the gradle_pin_check third entry (T003), a campsite doc edit
      (T002) and the whole Java dependency set with generated verification metadata (T003). On HALT this is either wasted review
      or half-merged. It also has 10 subtasks and the largest cross-cutting blast radius (every workflow-registration test).
    remediation: >
      WP01 = baseline (T001), minimal skeleton, spike, producer-native.yml, per-OS timings, verdict (T001, T003 skeleton only, T004,
      T005, T008, T009, T010). New WP01b (depends WP01 PASS, parallel with WP02) = T002 campsite, T006 hook/dist-set/pyproject,
      T007 event-producer.yml and fleet-verdict registration, gradle_pin_check entry. WP08 then depends on WP01b instead of WP01.
  - id: TASKS-DECOMP-004
    lens: Descriptions concrete enough to implement
    severity: 4
    title: No WP owns the launcher composition root that binds the real schema validator, and native-image metadata for the real producer is unowned
    evidence:
      - artifact: "tasks/WP04-java-produce-and-protocol.md Context ('Produce takes the RowSchemaValidator port; tests use a fake') and T028 ('real ports')"
      - artifact: "tasks/WP11-events-release-consumer.md T072, T073 (owns adapter/schema/** only; embeds schemas as native-image resources)"
      - artifact: "wps.yaml: launcher/src/main/java/.../launcher/*.java owned by WP04; META-INF/native-image/** owned by WP01; WP11 owns no launcher or build file"
      - artifact: "plan.md section 1 table (:application row) lists the ports but names no wiring owner"
    claim: >
      WP04 writes the launcher entry using a fake validator; WP11, which runs after WP04 and owns only adapter/schema/**, writes the
      real RowSchemaValidator. Nothing says which WP edits the launcher main to construct the schema adapter in place of the fake,
      nor which WP updates reachability/resource metadata (Jackson, schema resources, FFM) for the real producer, which
      META-INF/native-image/** (WP01) cannot anticipate. The likely outcomes are a launcher that wires an accept-all validator (AC-001
      and AC-002 pass vacuously in WP04, the real binary validates nothing until WP10 notices) or an out-of-map edit nobody reviews.
    remediation: >
      Assign it explicitly: add launcher/src/main/java/.../launcher/Wiring.java (or the existing entry) and the native-image
      metadata directory for the real producer to WP11's owned_files, add a WP11 subtask 'Bind schema adapter in launcher; native
      build resolves schemas' with the outcome 'launcher test with an invalid row replies rejected using the released schema', and
      state in WP04 T023/T028 that the default binding before WP11 is a validator that fails closed (refuses), never accept-all.
  - id: TASKS-DECOMP-005
    lens: Descriptions concrete enough to implement
    severity: 3
    title: Out-of-map edits are required by subtasks but not declared in owned_files or in the chokepoint table
    evidence:
      - artifact: "tasks/WP06 T038: 'Fakes in tests/runtime/test_bridge_engine.py gain the method' (file not in WP06 owned_files)"
      - code: "tests/next/test_mission_run_back_reference.py:233 (_NullSyncEmitter), tests/next/test_internal_runtime_coverage.py:280 (ZeitgeistRuntimeEmitterProducer), tests/next/test_runtime_bridge_unit.py:625 (FakeEmitter) implement the emitter surface and are unowned"
      - artifact: "tasks/WP03 T021 edits .github/workflows/event-producer.yml (WP01-owned, absent from chokepoint table)"
      - artifact: "tasks/WP05 T032 two-process produce/retain test and T033 launcher tests; launcher/src/test/** is WP04-owned"
      - artifact: "tasks/WP07 T046/T047 edit engine.py, test_producer_client_thinness.py and marker files owned by WP06"
    claim: >
      Overview R2 admits some out-of-map edits, but these are not listed. In particular WP06 changes the RuntimeEventEmitter Protocol
      (events.py:83-97 lists the eight emit_* methods) and only the test_bridge_engine fakes are named; the other fakes above would
      raise AttributeError if the engine path under test reaches emit_decision_authority_denied, and no WP owns them. WP05's launcher
      race test has no home under its own owned_files.
    remediation: >
      Add to WP06 owned_files tests/runtime/test_bridge_engine.py plus a census subtask step 'grep every class defining
      emit_significance_evaluated under tests/ and src/ (known: tests/next/test_mission_run_back_reference.py,
      tests/next/test_internal_runtime_coverage.py, tests/next/test_runtime_bridge_unit.py, tests/runtime/test_bridge_decision_log_flush.py)
      and add the method or prove the path is not reached'. Add launcher/src/test/java/.../retain/** to WP05 and event-producer.yml to the
      chokepoint table for WP03. In WP07 frontmatter note engine.py and the thinness test as recorded second-editor edits.
