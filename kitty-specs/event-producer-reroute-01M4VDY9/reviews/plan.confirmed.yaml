findings:
- id: PLAN-FIT-001
  lens: Architecture (blast radius, contracts preserved)
  severity: 4
  title: Retention treats "a lock file present" as a held lock, but the repo's lock primitive leaves its
    sidecar behind after release
  evidence:
  - artifact: "plan.md \xA7 8 (Mission open, 'Lock facts: a lock file present'); spec.md FR-029"
  - code: src/kernel/locks.py::_LockCore.release (truncates, never unlinks; guarantee G3) and ::_os_lock
      (fcntl.flock / msvcrt.locking)
  - code: docs/adr/4.x/2026-10-08-1-serialise-run-dir-advance.md (per-run lock sidecar <run_dir>/state.json.lock
      through kernel.locks.machine_file_lock)
  claim: 'Every run directory that ever took the run-cursor lock keeps an empty state.json.lock for good,
    so "file present" is true for essentially every run that has advanced once. Implemented as written,
    Retain either never finds an eligible run journal (retention silently does nothing in a real repo
    while the AC-013 fixtures, which plant a lock file, pass), or a Java reader that tries FileChannel.tryLock
    to test "held" does not interlock with Python''s flock on Linux/macOS (different advisory-lock families)
    and would report a live Python holder as free and delete under it. The plan names no held-lock test
    that both runtimes agree on.

    '
  remediation: 'Define the lock fact in plan section 8 as the lock sidecar''s content, not its presence:
    the sidecar holds a non-empty parsable LockRecord (the format of kernel.locks.LockRecord / read_lock_record)
    whose age is below the stale threshold; an empty or truncated sidecar is not a lock. Add two AC-013
    fixtures: a sidecar released by the real Python primitive (empty, run eligible) and one with a live
    record (run kept). State that Java never takes or tests an OS lock on Python-owned sidecars.

    '
  refuter_reason: kernel.locks release truncates and never unlinks (G3) so every run dir that advanced
    keeps state.json.lock, and plan section 8 / FR-029 define the lock fact as "a lock file present",
    which would make advanced run journals permanently ineligible (fails safe, so corrected severity 3)
    while planted-lock fixtures pass.
