- id: PLAN-VERIFY-001
  lens: Gate-implication audit / revert discipline (vacuity by empty set)
  severity: 4
  title: src/specify_cli/_native/ is not gitignored; the plan relies on it and AC-038 is vacuous in CI
  evidence:
  - artifact: research.md section 3 ('the directory is gitignored') and section 10 ('developers copy a
      built binary into the gitignored _native/'); plan.md section 3.2 (file list has no .gitignore) and
      section 3.1 (C-007, AC-038)
  - code: .gitignore (no _native entry; 'git check-ignore -v src/specify_cli/_native/spec-kitty-event-producer'
      prints nothing)
  - code: pyproject.toml [tool.hatch.build.targets.wheel].packages includes src/specify_cli; [tool.hatch.build.targets.sdist].include
      has 'src/**/*'
  claim: 'The plan states the _native/ directory is gitignored. It is not, and .gitignore is not in the
    changed-file list. Hatch honours .gitignore for both the wheel (packages) and the sdist (src/**/*),
    so a locally copied binary is not excluded: a hook-off ''uv build'' or ''python -m build'' on a developer
    machine ships the binary in the pure wheel and the sdist, and ''git status'' offers it for commit.
    AC-038 and the new test_packaging_safety assertions (''sdist and hook-off wheel contain no binary'')
    are also vacuous in CI, because a CI checkout never has a binary in _native/; they pass whether or
    not the exclusion works.

    '
  remediation: 'Add .gitignore entries for src/specify_cli/_native/ (a directory pattern) to the WP08
    file list. Make the packaging test plant a stub file in src/specify_cli/_native/ (untracked) and assert
    it is absent from the hook-off wheel and the sdist, and present only when the hook is on (force_include).
    Correct research.md section 3 and 10 accordingly.

    '
  refuter_reason: .gitignore has no _native entry (git check-ignore prints nothing), research.md sections
    3 and 10 wrongly claim it is gitignored, so a locally copied binary would be picked up by hatch and
    offered to git, and CI-side AC-038 assertions with no planted file are vacuous (severity 3 is arguable,
    4 is high but the packaging gap is real).
- id: PLAN-VERIFY-004
  lens: Silent-success / OS-specific tests
  severity: 3
  title: Artifact round-trip drops the executable bit; the wheel then carries a non-executable binary
    on Linux and macOS
  evidence:
  - artifact: plan.md section 3.3 item 2 (producer artifacts uploaded by producer-native.yml, downloaded
      in build-release, wheels built there); research.md section 3 test row ('executable bit preserved')
  - code: .github/workflows/release.yml (actions/upload-artifact / download-artifact are used for release-distributions)
  - artifact: "plan.md \xA7 3.1 (force_include of the binary), \xA7 3.3 step 2 (download the three producer\
      \ artifacts, then build wheels), \xA7 2"
  - code: hatchling 1.31.0 builders/utils.py::normalize_file_permissions (755 only if st_mode has the
      owner exec bit) and builders/wheel.py (external_attr from file stat)
  claim: 'actions/upload-artifact does not keep file permission bits, so the binary downloaded in build-release
    is mode 0644 and hatch''s force_include records that mode in the wheel; pip installs a non-executable
    file. The planned packaging test uses a stub built in the same job (mode preserved), so it cannot
    see this. The smoke-wheels job would go red but with a misleading ''crash'' or ''binary-missing''
    cause, and the macOS and Linux wheels are only proven on their own OS legs.

    '
  remediation: 'Have the hook set mode 0755 explicitly on non-Windows platform tags (or tar the binary
    in the artifact), and have check_dist_set.py --verify-binaries assert the member''s mode bits in the
    zip external attributes for the Linux and macOS wheels (mutation: a 0644 member fails).

    '
  also_ids:
  - PLAN-RELEASE-002
  refuter_reason: Plan section 3.3 builds wheels in build-release from artifacts downloaded via download-artifact,
    which does not preserve mode bits, and hatch force_include takes the wheel mode from the file stat
    while the planned packaging test (research.md row for test_packaging_safety) uses a same-job stub,
    so a 0644 binary in the Linux/macOS wheels is neither prevented nor caught by the check_dist_set gate
    (severity 3 stands).
- id: PLAN-VERIFY-005
  lens: Silent-success / file locking
  severity: 3
  title: Retain deletes whole publish-log files without taking the clock lock; a concurrent produce can
    report produced and lose the row
  evidence:
  - artifact: plan.md section 8 ('calls delete on whole files'; 'opens no file for write in retain') and
      section 7 (one clock.lock held across stamp and append)
  - artifact: research.md section 5 ('retention never lists clock.json or clock.lock'); spec.md FR-029
      ('holds no lock')
  claim: 'The only serialisation point is clock.lock, held by produce across stamp, dedupe and append.
    Retain does not take it. On Linux and macOS a delete between produce''s open and append unlinks the
    inode and the appended row is lost while the reply says produced; on Windows the delete fails with
    a sharing violation that the plan does not map to kept-with-reason. A Mission can be closed, old and
    outside keep_runs yet still receive a late retrospective or lifecycle row, so the window is real.
    The "lock facts" input of FR-029 is also ambiguous because clock.lock always exists.

    '
  remediation: 'Specify that Retain takes clock.lock (bounded by deadline_ms) around each candidate delete
    and re-checks eligibility and file length under the lock; map a delete failure to kept-with-reason.
    Define "lock facts" as lock files of other writers, never clock.lock. Add a two-process test (produce
    racing retain --apply on an eligible file).

    '
  refuter_reason: Plan sections 7 and 8 and research section 5 show produce holding clock.lock across
    append while retain deletes whole files with no lock and no re-check, and no section handles the delete-versus-append
    race; severity is overstated to 2 because it needs an explicit --apply on a closed, old Mission file
    concurrent with a late row.
