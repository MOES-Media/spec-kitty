    '
  refuter_reason: WP01 exit criteria require a stub wheel built with the hook while section 3.1/3.2 and
    the WP table give the hook file and the pyproject.toml table solely to WP08, which depends on WP01;
    severity 2 to 3 since a throwaway spike hook is a cheap resolution.
