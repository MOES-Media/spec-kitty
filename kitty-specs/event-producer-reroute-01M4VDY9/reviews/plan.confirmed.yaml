- id: PLAN-RELEASE-001
  lens: release/packaging feasibility (provenance)
  severity: 4
  title: Reusable producer-native.yml is not told which ref to build, so a workflow_dispatch republish
    builds the binary from the dispatching branch, not the release tag
  evidence:
  - artifact: "plan.md \xA7 2 CI shape; \xA7 3.3 step 1 (build-producer 'uses the reusable workflow')"
  - code: '.github/workflows/release.yml::env.RELEASE_REF and build-release ''Check out repository'' (ref:
      ${{ env.RELEASE_REF }}); workflow-level env is not visible inside a called workflow'
  claim: release.yml supports workflow_dispatch with an 'tag' input (github.ref is then the dispatching
    branch). build-release explicitly checks out RELEASE_REF, but the plan's reusable workflow has no
    stated ref input, so its checkout defaults to github.sha. The native binary would then be compiled
    from a different commit than the wheels' Python sources and the tag, while the manifest's 'source
    commit' is only recorded, never compared. Smoke passes, the dist-set check passes, and the published
    binary is not from the tagged source (a provenance and Standing Order 9 integrity hole).
  remediation: Give producer-native.yml a required 'ref' input, pass RELEASE_REF from release.yml (and
    github.sha from event-producer.yml), check out that ref, and add a build-release step that fails unless
    every producer-manifest.json 'source commit' equals 'git rev-parse HEAD' of the release checkout.
    Pin the 'build-producer ref input' in test_release_ci_ownership.py.
  refuter_reason: Plan 2/3.3 calls the reusable workflow with no ref input, release.yml's RELEASE_REF
    is a workflow-level env not visible to a called workflow, and the manifest's source commit is only
    recorded, so a workflow_dispatch republish could build the binary from the dispatching ref (severity
    3, dispatch path only).
- id: PLAN-RELEASE-003
  lens: release/packaging feasibility (dist-set equality)
  severity: 3
  title: Platform wheel tags are both 'measured from the binary' and 'pinned in dist-set.json'; the two
    disagree on a first real release
  evidence:
  - artifact: "plan.md \xA7 2 table (tag 'measured from the binary's glibc symbols', macOS 'measured minos');\
      \ \xA7 3.2 (dist-set.json pins the expected list of tags); \xA7 3.3 step 2 (check_dist_set.py: set\
      \ equals dist-set.json)"
  - code: scripts/release/ has no check_dist_set.py yet; hatchling takes the tag verbatim from build_data['tag']
  claim: A binary built in a manylinux_2_28 container typically needs a lower maximum GLIBC_ symbol (for
    example 2.17) than 2.28, and a macOS binary's minos depends on how native-image passes the deployment
    target. If the hook derives the tag from the measurement, the wheel name will not equal the pinned
    manylinux_2_28/macosx_11_0 tag and check_dist_set.py (the release gate) fails on the first tag; if
    it uses the pinned tag, the 'measured' claim is decoration. The plan does not say which one governs.
  remediation: "Make dist-set.json the single authority for the tag (the floor) and turn the measurement\
    \ into an assertion: fail the leg when the measured maximum GLIBC_ version exceeds the pinned manylinux\
    \ floor or the measured minos exceeds the pinned macOS floor. Say so in \xA7 2 and give the hook the\
    \ tag from dist-set.json, not from the binary."
  refuter_reason: Plan 2 says the wheel tag is measured from the binary while dist-set.json pins it (research
    38 and 54 repeat the split), and neither document says which governs, so a measured 2.17 against a
    pinned manylinux_2_28 would fail check_dist_set on the first release (severity 2, loud failure not
    silent).
- id: PLAN-SHIM-001
  lens: allowed-surface gate testability (FR-027)
  severity: 4
  title: Gate cannot detect a new function in an existing allowed file, so the FR-027 "other new module
    or function" clause is untestable as designed
  evidence:
  - artifact: "plan.md \xA7 4.2 (gate paragraph, rules (a) and (c)); spec.md FR-027, AC-012"
  - code: src/specify_cli/status/emit.py, src/specify_cli/status/lifecycle_events.py, src/runtime/next/_internal_runtime/engine.py
      (listed in the 4.2 table by symbol, but never symbol-pinned by the gate)
  claim: 'Rule (a) pins the exact top-level symbol set only for the three NEW modules; rule (c) is a module-level
    census. The 4.2 table lists allowed symbols in about a dozen EXISTING files, but nothing checks them.
    A WP agent can add an id-minting, row-building or validation helper inside emit.py, lifecycle_events.py
    or engine.py and every rule passes. That is the main route by which logic leaks into Python, and AC-012
    ("new Python logic outside the allowed surface of FR-027 fails") has no mutation that would catch
    it (the listed mutations all target "a copy" of the client).

    '
  remediation: 'Add rule (e): for every existing file in the 4.2 table, pin the full AST set of top-level
    functions, classes and methods at the base commit plus the table''s allowed new names; a new name
    fails. Add a floor (all table files found, set sizes above zero) and a self-mutation case that adds
    a helper (for example _mint_id) to a copy of emit.py and must fail. State in 4.2 that the table''s
    "changed" symbols may change bodies but not gain callees from uuid/ulid/hashlib/datetime (extend the
    import-allowlist rule to those hunks, or pin the import set of each file).

    '
  refuter_reason: Section 4.2 says the gate fails on any new module or function in the emission area,
    but rules (a) to (d) pin symbols only for the three new modules and census modules, so a helper added
